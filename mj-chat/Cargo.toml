[package]
name = "brokk-mj-chat"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Conversation view state and input surfaces for Mjolnir"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_chat"

[features]
default = []
test-hooks = ["hel/test-hooks"]

[lints]
workspace = true

[dependencies]
hel = { workspace = true, features = ["controller"] }
mj-client.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.10", default-features = false }
png = "0.18"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rat-event = "2.1.0"
rat-focus = "2.1.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
textwrap = "0.16"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
unicode-segmentation = "1"
# Measures display width without the temporary `Line` that `Line::width()`
# needs; transcript wrapping calls this once per grapheme.
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
