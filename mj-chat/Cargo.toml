[package]
name = "brokk-mj-chat"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license-file.workspace = true
license.workspace = true
description = "Conversation view state and input surfaces for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_chat"

[features]
default = []
test-hooks = ["mj-core/test-hooks"]

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript.workspace = true
mj-client.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
base64.workspace = true
chrono.workspace = true
crossterm.workspace = true
pulldown-cmark = { version = "0.10", default-features = false }
png = "0.18"
ratatui.workspace = true
rat-event = "2.1.0"
rat-focus = "2.1.1"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
textwrap = "0.16"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
unicode-segmentation = "1"
# Measures display width without the temporary `Line` that `Line::width()`
# needs; transcript wrapping calls this once per grapheme.
unicode-width = "0.2"

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
