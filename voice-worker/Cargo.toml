[package]
name = "brokk-mj-voice-worker"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Codex OAuth dictation sidecar for Mjolnir"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lints]
workspace = true

[[bin]]
name = "mj-voice-worker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
anvil-llm.workspace = true
bytes = "1"
cpal = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[dev-dependencies]
tempfile = "3"
