[package]
name = "brokk-mj-worker-staging"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Putting the Mjolnir worker, its harness and its profile onto a session's target"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_worker_staging"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
mj-session-types.workspace = true
mj-accounts.workspace = true
anyhow.workspace = true
chrono.workspace = true
flate2.workspace = true
getrandom.workspace = true
rayon.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime" }
tempfile.workspace = true
