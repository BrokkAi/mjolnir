[package]
name = "brokk-mj-import"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Session import, project catalog, transcript compaction and handoff for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_import"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-targets/test-hooks", "mj-store/test-hooks", "mj-accounts/test-hooks"]
# Exposes the shared test fixtures to the tests of the crates above.
test-support = ["mj-core/test-hooks", "mj-targets/test-support", "mj-store/test-support", "mj-accounts/test-support"]

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript = { workspace = true, features = ["github-history"] }
mj-checkpoint.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
mj-accounts.workspace = true
anvil-client.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures = "0.3"
rayon.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "query", "stream"] }
rusqlite.workspace = true
ruzstd.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat", "io"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
mj-targets = { workspace = true, features = ["test-support"] }
mj-store = { workspace = true, features = ["test-support"] }
mj-accounts = { workspace = true, features = ["test-support"] }
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
