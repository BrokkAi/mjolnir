[package]
name = "brokk-mj-import"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Session import, project catalog, transcript compaction and handoff for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_import"
