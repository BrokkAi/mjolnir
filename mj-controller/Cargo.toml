[package]
name = "brokk-mj-controller"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Daemon-side controller, session manager, and web server for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[features]
migrate-cli = ["dep:clap"]

[lib]
name = "mj_controller"
# The crate has no doc tests. Looking for them makes rustdoc compile the whole
# crate again: 2.5 minutes of every CI run, to run nothing.
doctest = false

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript.workspace = true
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
mj-worker-launch.workspace = true
mj-profile-catalog.workspace = true
mj-session-runtime.workspace = true
mj-worker-staging.workspace = true
mj-session-types.workspace = true
mj-build-cache.workspace = true
mj-sessionwiki.workspace = true
mj-import.workspace = true
mj-accounts.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, optional = true }
flate2.workspace = true
futures = "0.3"
rayon.workspace = true
reedline = { version = "0.51", default-features = false }
reqwest.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zstd.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
base64.workspace = true
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime" }
http-body-util = "0.1"
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
