[package]
name = "brokk-mj-controller"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license-file.workspace = true
license.workspace = true
description = "Daemon-side controller, session manager, and web server for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_controller"

[features]
default = []
test-hooks = ["mj-core/test-hooks"]

[lints]
workspace = true

[dependencies]
sysinfo.workspace = true
signal-hook = "0.3"
mj-core.workspace = true
mj-review.workspace = true
mj-transcript.workspace = true
mj-checkpoint.workspace = true
mj-client.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
flate2.workspace = true
futures = "0.3"
getrandom.workspace = true
# HMAC-SHA256 signs the stateless remote-viewer session cookie (keyed on a
# persisted signing key); pairs with the existing `sha2`.
hmac = "0.13"
libc.workspace = true
rayon.workspace = true
reedline = { version = "0.51", default-features = false }
reqwest = { workspace = true, features = ["blocking", "json", "stream"] }
rustls.workspace = true
rusqlite.workspace = true
semver = "1"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
url.workspace = true
zip.workspace = true
anvil-client.workspace = true

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker" }
http-body-util = "0.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
