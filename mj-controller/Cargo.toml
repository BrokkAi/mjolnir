[package]
name = "brokk-mj-controller"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Daemon-side controller, session manager, and web server for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_controller"
# The crate has no doc tests. Looking for them makes rustdoc compile the whole
# crate again: 2.5 minutes of every CI run, to run nothing.
doctest = false

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-targets/test-hooks", "mj-store/test-hooks", "mj-accounts/test-hooks", "mj-import/test-hooks", "mj-sessionwiki/test-hooks", "mj-build-cache/test-hooks"]
# Exposes the shared test fixtures to the tests of mj-daemon.
test-support = ["mj-core/test-hooks", "mj-targets/test-support", "mj-store/test-support", "mj-accounts/test-support", "mj-import/test-support", "mj-sessionwiki/test-support", "mj-build-cache/test-support"]

[lints]
workspace = true

[dependencies]
sysinfo.workspace = true
mj-core.workspace = true
mj-transcript = { workspace = true, features = ["github-history"] }
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
mj-build-cache.workspace = true
mj-sessionwiki.workspace = true
mj-import.workspace = true
mj-accounts.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
futures = "0.3"
getrandom.workspace = true
libc.workspace = true
rayon.workspace = true
reedline = { version = "0.51", default-features = false }
reqwest = { workspace = true, features = ["blocking", "json", "query", "stream"] }
ring.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat", "io"] }
tracing.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
mj-targets = { workspace = true, features = ["test-support"] }
mj-store = { workspace = true, features = ["test-support"] }
mj-build-cache = { workspace = true, features = ["test-support"] }
mj-sessionwiki = { workspace = true, features = ["test-support"] }
mj-import = { workspace = true, features = ["test-support"] }
mj-accounts = { workspace = true, features = ["test-support"] }
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime", features = ["test-hooks"] }
http-body-util = "0.1"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
