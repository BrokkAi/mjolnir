[package]
name = "brokk-mjolnir"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Forge-grade terminal client for any Agent Client Protocol (ACP) server"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[workspace]
members = ["mj-core", "mj-agents", "mj-anvil", "mj-tui", "mj-desktop", "mj-remote", "voice-worker"]
# Bare `cargo test`/`cargo clippy`/`cargo build` must cover the binary and every
# crate its code was extracted into, or those crates lose their lint and test
# gate. `mj-desktop` and `voice-worker` stay out so an ordinary contributor does
# not need WebKitGTK or ALSA to build: each has its own CI job, and the
# `desktop-app` feature still pulls `mj-desktop` in when it is requested.
# `mj-anvil` only ships in the Android binary, so it also stays out of the
# default set; the Android CI job carries its lint and test gate.
default-members = [".", "mj-core", "mj-agents", "mj-tui", "mj-remote"]

# Single source of truth for the release version; workspace crates inherit it, so
# they cannot drift apart (RELEASING.md requires them to match).
[workspace.package]
version = "1.11.2"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
homepage = "https://github.com/BrokkAi/mjolnir"
keywords = ["mjolnir", "acp", "ai", "agents"]
categories = ["development-tools", "command-line-utilities"]

# Keep every same-release workspace dependency requirement here. Cargo requires
# published path dependencies to carry a registry version, but release bumps
# should still change that version in one manifest rather than in every crate.
[workspace.dependencies]
mj-core = { package = "brokk-mj-core", path = "mj-core", version = "1.11.2" }
mj-agents = { package = "brokk-mj-agents", path = "mj-agents", version = "1.11.2" }
mj-anvil = { package = "brokk-mj-anvil", path = "mj-anvil", version = "1.11.2" }
mj-tui = { package = "brokk-mj-tui", path = "mj-tui", version = "1.11.2" }
mj-remote = { package = "brokk-mj-remote", path = "mj-remote", version = "1.11.2" }
mj-desktop = { package = "brokk-mj-desktop", path = "mj-desktop", version = "1.11.2" }

[[bin]]
name = "mj"
path = "src/main.rs"

[features]
default = []
# Kept opt-in until the `mj app` CLI and release packaging land in #727.
# Android deliberately has no dependency entries for this feature.
desktop-app = ["dep:mj-desktop"]

[dependencies]
mj-core.workspace = true
mj-agents.workspace = true
mj-tui.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
async-trait = "0.1"
# Use the ring CryptoProvider (already pulled by reqwest/rcgen) instead of the
# default aws-lc-rs, which needs cmake + a C toolchain and fails to
# cross-compile cleanly for the Android CI target.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
# `clock` pulls `iana-time-zone`/`android-tzdata` so `Local` can render reset
# timestamps in the machine's wall-clock time (DST-correct); `default-features
# = false` drops the wasm-only bits. chrono is already in the tree via rmcp.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
flate2 = "1"
futures = "0.3"
# HMAC-SHA256 signs the stateless remote-viewer session cookie (keyed on a
# persisted signing key); pairs with the existing `sha2`.
hmac = "0.12"
# Resolves the IANA zone name (e.g. "Europe/Paris") to append to reset times.
iana-time-zone = "0.1"
mj-remote.workspace = true
libc = "0.2"
signal-hook = "0.3"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
# Official Rust MCP SDK. Powers the in-process subagent, memory, and review
# servers exposed to ACP adapters through the stdio bridge. MIT-licensed.
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Parses the tailscale-issued certificate/key PEMs for the SNI resolver in
# `mj server --tailscale`. Already in the tree via reqwest's rustls-tls.
rustls-pemfile = "2"
# JSON Schema derivation for MCP tool argument structs (used by rmcp's `#[tool]`
# macro). Already in the tree via agent-client-protocol; pinned to the same 1.x.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
similar = "2.7"
tar = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "android"))'.dependencies.mj-desktop]
workspace = true
optional = true

# Anvil is the self-contained ACP route on Android, where the npx-based
# built-in adapters cannot run (issue #685). Other targets never compile it.
[target.'cfg(target_os = "android")'.dependencies.mj-anvil]
workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
