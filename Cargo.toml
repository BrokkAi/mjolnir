[workspace]
resolver = "3"
members = ["mj-core", "mj-harness-install", "mj-review", "mj-checkpoint", "mj-transcript", "mj-build-id", "mj-microvm", "mj-worker-mcp", "mj-worker-review", "mj-worker", "mj-worker-bin", "mj-client", "mj-targets", "mj-session-types", "mj-store", "mj-accounts", "mj-import", "mj-sessionwiki", "mj-build-cache", "mj-worker-staging", "mj-worker-launch", "mj-profile-catalog", "mj-session-runtime", "mj-review-host", "mj-github-relevance", "mj-github-watch", "mj-controller", "mj-setup", "mj-server", "mj-daemon", "mj-chat", "mj-tui", "mj-cli", "voice-worker"]
default-members = ["mj-core", "mj-harness-install", "mj-review", "mj-checkpoint", "mj-transcript", "mj-build-id", "mj-microvm", "mj-worker-mcp", "mj-worker-review", "mj-worker", "mj-worker-bin", "mj-client", "mj-targets", "mj-session-types", "mj-store", "mj-accounts", "mj-import", "mj-sessionwiki", "mj-build-cache", "mj-worker-staging", "mj-worker-launch", "mj-profile-catalog", "mj-session-runtime", "mj-review-host", "mj-github-relevance", "mj-github-watch", "mj-controller", "mj-setup", "mj-server", "mj-daemon", "mj-chat", "mj-tui", "mj-cli"]

# Single source of truth for the release version. Every published crate
# inherits it with `version.workspace = true`, so all package versions
# cannot drift apart (RELEASING.md requires them to match).
[workspace.package]
version = "2.73.0"
edition = "2024"
license = "GPL-3.0-only"
# Each published crate carries a `LICENSE` symlink to the root file. `cargo
# package` dereferences it, so every crate ships the GPL text without the
# manifest warning that setting both `license` and `license-file` produces.
readme = "README.md"
repository = "https://github.com/BrokkAi/mjolnir"
homepage = "https://github.com/BrokkAi/mjolnir"
keywords = ["mjolnir", "acp", "ai", "agents"]
categories = ["development-tools", "command-line-utilities"]
# The real compiler floor is the pinned toolchain in `rust-toolchain.toml`,
# not just what edition 2024 implies. Declaring it makes `cargo install` on an
# older compiler fail with a clear version message instead of mid-build
# errors. Bump it in lockstep with `rust-toolchain.toml`.
rust-version = "1.99"

# Cargo requires a published path dependency to carry a registry version and
# does not let that version inherit from `[workspace.package]`, so the number
# is repeated here. Keeping every same-release path dependency in this one
# table lets cargo-release update the version requirements automatically.
[workspace.dependencies]
semver = "1"
mj-review = { path = "mj-review", package = "brokk-mj-review", version = "2.73.0" }
mj-transcript = { path = "mj-transcript", package = "brokk-mj-transcript", version = "2.73.0" }
mj-checkpoint = { path = "mj-checkpoint", package = "brokk-mj-checkpoint", version = "2.73.0" }
anvil-client = { package = "brokk-anvil-client", version = "0.28.6" }
mj-core = { path = "mj-core", package = "brokk-mj-core", version = "2.73.0", default-features = false }
mj-harness-install = { path = "mj-harness-install", package = "brokk-mj-harness-install", version = "2.73.0" }
mj-build-id = { path = "mj-build-id", package = "brokk-mj-build-id", version = "2.73.0" }
mj-microvm = { path = "mj-microvm", package = "brokk-mj-microvm", version = "2.73.0" }
mj-worker-mcp = { path = "mj-worker-mcp", package = "brokk-mj-worker-mcp", version = "2.73.0" }
mj-worker-review = { path = "mj-worker-review", package = "brokk-mj-worker-review", version = "2.73.0" }
mj-worker = { path = "mj-worker", package = "brokk-mj-worker-runtime", version = "2.73.0" }
mj-client = { path = "mj-client", package = "brokk-mj-client", version = "2.73.0" }
mj-targets = { path = "mj-targets", package = "brokk-mj-targets", version = "2.73.0" }
mj-session-types = { path = "mj-session-types", package = "brokk-mj-session-types", version = "2.73.0" }
mj-store = { path = "mj-store", package = "brokk-mj-store", version = "2.73.0" }
mj-accounts = { path = "mj-accounts", package = "brokk-mj-accounts", version = "2.73.0" }
mj-github-relevance = { path = "mj-github-relevance", package = "brokk-mj-github-relevance", version = "2.73.0" }
mj-github-watch = { path = "mj-github-watch", package = "brokk-mj-github-watch", version = "2.73.0" }
mj-import = { path = "mj-import", package = "brokk-mj-import", version = "2.73.0" }
mj-sessionwiki = { path = "mj-sessionwiki", package = "brokk-mj-sessionwiki", version = "2.73.0" }
mj-build-cache = { path = "mj-build-cache", package = "brokk-mj-build-cache", version = "2.73.0" }
mj-worker-staging = { path = "mj-worker-staging", package = "brokk-mj-worker-staging", version = "2.73.0" }
mj-session-runtime = { path = "mj-session-runtime", package = "brokk-mj-session-runtime", version = "2.73.0" }
mj-review-host = { path = "mj-review-host", package = "brokk-mj-review-host", version = "2.73.0" }
mj-profile-catalog = { path = "mj-profile-catalog", package = "brokk-mj-profile-catalog", version = "2.73.0" }
mj-worker-launch = { path = "mj-worker-launch", package = "brokk-mj-worker-launch", version = "2.73.0" }
mj-controller = { path = "mj-controller", package = "brokk-mj-controller", version = "2.73.0" }
mj-setup = { path = "mj-setup", package = "brokk-mj-setup", version = "2.73.0" }
mj-server = { path = "mj-server", package = "brokk-mj-server", version = "2.73.0" }
mj-daemon = { path = "mj-daemon", package = "brokk-mj-daemon", version = "2.73.0" }
mj-chat = { path = "mj-chat", package = "brokk-mj-chat", version = "2.73.0" }
mj-tui = { path = "mj-tui", package = "brokk-mj-tui", version = "2.73.0" }
sessionwiki = { package = "brokk-sessionwiki", version = "0.34.27" }

# Every external dependency that two or more crates share is declared once
# here, so a version can only be raised in one place. Each entry carries the
# features every user of it needs; a crate that needs more adds them beside
# `workspace = true`, which unions them with these.
agent-client-protocol = { version = "5", features = ["unstable_session_fork", "unstable_session_system_prompt", "unstable_end_turn_token_usage"] }
anyhow = "1"
axum = "0.8"
# Use the ring provider already pulled by reqwest instead of aws-lc-rs, which
# needs a C toolchain and complicates cross-compilation.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
# Local-time support (chrono's default `clock`) renders reset timestamps
# in the machine's wall-clock time.
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
# `rust_backend` is flate2 1.1.9's whole default; naming it keeps every crate
# on the pure-Rust deflate without a C toolchain.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.3", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imbl = { version = "7.0.2", features = ["serde"] }
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
libc = { version = "0.2", features = ["extra_traits"] }
memchr = "2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rayon = "1"
# `rustls-no-provider` takes the process-wide rustls provider instead of
# pulling aws-lc-rs, which needs a C toolchain and complicates
# cross-compilation. Every executable installs the ring provider at startup
# through `mj_server::server::install_rustls_crypto_provider`.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking", "json", "query", "stream"] }
ring = "0.17"
rusqlite = { version = "0.41", features = ["backup", "bundled", "fallible_uint", "functions"] }
ruzstd = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive", "rc", "alloc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Names config-file keys that no field reads; see `Config::load_from`.
serde_ignored = "0.1"
sha2 = "0.11"
hmac = "0.13"
# Without `multithread`: a single-PID refresh would wake a rayon thread per CPU.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tar = "0.4"
tiny_http = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt", "compat", "io", "codec"] }
toml = "0.8"
toml_edit = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
# Windows-only crates add the API features they call.
windows-sys = "0.61"
zip = { version = "2", default-features = false, features = ["deflate", "zstd"] }

[workspace.lints.clippy]
disallowed_methods = "warn"

[profile.dev]
# Line tables keep file:line backtraces while cutting ~230MB of DWARF per
# binary; links and test builds get materially faster. Use a temporary
# `debug = 2` override when a debugger needs full variable info.
debug = "line-tables-only"

# Checkpoint packaging runs in the target's development worker during normal
# local use. Optimize the measured compression and digest hot loops without
# changing the rest of the development build.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Release builds trade run time for build time and memory. Mjolnir waits on
# child processes, sockets and timers; its own code is not where its time goes.
# Its crates are built at opt-level 1 and every dependency at 3, which keeps
# compression, hashing, SQLite and TLS as fast as before.
#
# Measured on three cores, building `mj` and `mj-worker` from scratch
# (2026-11-19): 694 s and a 5.0 GB peak with everything at opt-level 3; 486 s
# and 4.1 GB with these settings; `mj` goes from 223 MB to 186 MB. The macOS
# release runner has three cores and 7 GB, and builds each architecture in turn.
[profile.release]
opt-level = 1

[profile.release.package."*"]
opt-level = 3
