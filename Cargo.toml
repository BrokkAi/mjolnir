[workspace]
resolver = "3"
# mj-desktop stays out of the default set: plain builds produce the headless
# controller/worker, while its own GNU/Linux CI job and the macOS/Windows
# matrix build the separate native application explicitly.
members = ["mj-core", "mj-review", "mj-checkpoint", "mj-transcript", "mj-worker", "mj-client", "mj-controller", "mj-chat", "mj-tui", "mj-cli", "mj-desktop", "voice-worker"]
default-members = ["mj-core", "mj-review", "mj-checkpoint", "mj-transcript", "mj-worker", "mj-client", "mj-controller", "mj-chat", "mj-tui", "mj-cli"]

# Single source of truth for the release version. Every published crate
# inherits it with `version.workspace = true`, so all package versions
# cannot drift apart (RELEASING.md requires them to match).
[workspace.package]
version = "2.15.0"
edition = "2024"
license = "GPL-3.0-only"
# Each published crate carries a `LICENSE` symlink to the root file. `cargo
# package` dereferences it, so every crate ships the GPL text without the
# manifest warning that setting both `license` and `license-file` produces.
readme = "README.md"
repository = "https://github.com/BrokkAi/mjolnir"
homepage = "https://github.com/BrokkAi/mjolnir"
keywords = ["mjolnir", "acp", "ai", "agents"]
categories = ["development-tools", "command-line-utilities"]
# The real compiler floor is the pinned toolchain in `rust-toolchain.toml`,
# not just what edition 2024 implies. Declaring it makes `cargo install` on an
# older compiler fail with a clear version message instead of mid-build
# errors. Bump it in lockstep with `rust-toolchain.toml`.
rust-version = "1.96"

# Cargo requires a published path dependency to carry a registry version and
# does not let that version inherit from `[workspace.package]`, so the number
# is repeated here. Keeping every same-release path dependency in this one
# table lets cargo-release update the version requirements automatically.
[workspace.dependencies]
mj-review = { path = "mj-review", package = "brokk-mj-review", version = "2.15.0" }
mj-transcript = { path = "mj-transcript", package = "brokk-mj-transcript", version = "2.15.0" }
mj-checkpoint = { path = "mj-checkpoint", package = "brokk-mj-checkpoint", version = "2.15.0" }
anvil-client = { package = "brokk-anvil-client", version = "0.28.2" }
mj-core = { path = "mj-core", package = "brokk-mj-core", version = "2.15.0", default-features = false }
mj-worker = { path = "mj-worker", package = "brokk-mj-worker", version = "2.15.0" }
mj-client = { path = "mj-client", package = "brokk-mj-client", version = "2.15.0" }
mj-controller = { path = "mj-controller", package = "brokk-mj-controller", version = "2.15.0" }
mj-chat = { path = "mj-chat", package = "brokk-mj-chat", version = "2.15.0" }
mj-tui = { path = "mj-tui", package = "brokk-mj-tui", version = "2.15.0" }
sessionwiki = { package = "brokk-sessionwiki", version = "0.30.1" }

# Every external dependency that two or more crates share is declared once
# here, so a version can only be raised in one place. Each entry carries the
# features every user of it needs; a crate that needs more adds them beside
# `workspace = true`, which unions them with these.
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
axum = "0.8"
# Use the ring provider already pulled by reqwest instead of aws-lc-rs, which
# needs a C toolchain and complicates cross-compilation.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
# `clock` enables local-time support so `Local` can render reset timestamps in
# the machine's wall-clock time (DST-correct); `default-features = false` drops
# the wasm-only bits.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
# `rust_backend` is flate2 1.1.9's whole default; naming it keeps every crate
# on the pure-Rust deflate without a C toolchain.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rayon = "1"
# `rustls-no-provider` takes the process-wide rustls provider instead of
# pulling aws-lc-rs, which needs a C toolchain and complicates
# cross-compilation. Every executable installs the ring provider at startup
# through `mj_controller::server::install_rustls_crypto_provider`.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = "0.32"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate", "zstd"] }

[workspace.lints.clippy]
disallowed_methods = "warn"

[profile.dev]
# Line tables keep file:line backtraces while cutting ~230MB of DWARF per
# binary; links and test builds get materially faster. Use a temporary
# `debug = 2` override when a debugger needs full variable info.
debug = "line-tables-only"

# Checkpoint packaging runs in the target's development worker during normal
# local use. Optimize the measured compression and digest hot loops without
# changing the rest of the development build.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
