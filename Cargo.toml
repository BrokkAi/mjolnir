[package]
name = "brokk-mj-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Session control plane for ACP coding agents"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true
include = [
    "src/**/*.rs",
    "src/web/**",
    "src/icons/**",
    "src/fonts/jetbrains-mono.woff2",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "docs/DOCKER.md",
    "docs/PODMAN.md",
    "LICENSE",
    "licenses/THIRD_PARTY_LICENSES.html",
    "licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt",
]

# The package publishes under the Brokk namespace while the library keeps the
# `hel` crate name that the workspace imports use, so the rename to the
# mjolnir deploy identities required no source changes.
[lib]
name = "hel"

[features]
default = []
test-hooks = []

[workspace]
# mj-desktop stays out of the default set: plain builds produce the headless
# controller/worker, while its own GNU/Linux CI job and the macOS/Windows
# matrix build the separate native application explicitly.
members = [".", "mj-tui", "mj-cli", "mj-desktop", "voice-worker"]
default-members = [".", "mj-tui", "mj-cli"]

# Single source of truth for the release version. Every published crate
# inherits it with `version.workspace = true`, so the five package versions
# cannot drift apart (RELEASING.md requires them to match).
[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
homepage = "https://github.com/BrokkAi/mjolnir"
keywords = ["mjolnir", "acp", "ai", "agents"]
categories = ["development-tools", "command-line-utilities"]
# The real compiler floor is the pinned toolchain in `rust-toolchain.toml`,
# not just what edition 2024 implies. Declaring it makes `cargo install` on an
# older compiler fail with a clear version message instead of mid-build
# errors. Bump it in lockstep with `rust-toolchain.toml`.
rust-version = "1.96"

# Cargo requires a published path dependency to carry a registry version and
# does not let that version inherit from `[workspace.package]`, so the number
# is repeated here. Keeping every same-release path dependency in this one
# table means a bump touches one manifest, and
# `node scripts/release-version.mjs check` (run in CI) fails when these fall
# behind the workspace version.
[workspace.dependencies]
hel = { path = ".", package = "brokk-mj-core", version = "2.0.0" }
hel-tui = { path = "mj-tui", package = "brokk-mj-tui", version = "2.0.0" }

[workspace.lints.clippy]
disallowed_methods = "warn"

[lints]
workspace = true

[dependencies]
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
axum = "0.8"
# Use the ring provider already pulled by reqwest instead of aws-lc-rs, which
# needs a C toolchain and complicates cross-compilation.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
# Grok Build keys long session directories by BLAKE3; Hel has to reproduce that
# name exactly to restore a checkpoint. `default-features = false` keeps the
# cross-compiled musl build free of the optional Rayon and SIMD extras.
blake3 = { version = "1", default-features = false, features = ["std"] }
# `clock` pulls `iana-time-zone`/`android-tzdata` so `Local` can render reset
# timestamps in the machine's wall-clock time (DST-correct); `default-features
# = false` drops the wasm-only bits.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
getrandom = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# HMAC-SHA256 signs the stateless remote-viewer session cookie (keyed on a
# persisted signing key); pairs with the existing `sha2`.
hmac = "0.12"
# Resolves the IANA zone name (e.g. "Europe/Paris") to append to reset times.
iana-time-zone = "0.1"
libc = "0.2"
pulldown-cmark = { version = "0.10", default-features = false }
qrcode = { version = "0.14", default-features = false }
signal-hook = "0.3"
sysinfo = "0.32"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rayon = "1"
reedline = { version = "0.51", default-features = false }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2.7"
tar = "0.4"
tempfile = "3"
textwrap = "0.16"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
unicode-segmentation = "1"
# Measures display width without the temporary `Line` that `Line::width()`
# needs; transcript wrapping calls this once per grapheme.
unicode-width = "0.2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
# Line tables keep file:line backtraces while cutting ~230MB of DWARF per
# binary; links and test builds get materially faster. Use a temporary
# `debug = 2` override when a debugger needs full variable info.
debug = "line-tables-only"

# Checkpoint packaging runs in the target's development worker during normal
# local use. Optimize the measured compression and digest hot loops without
# changing the rest of the development build.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
