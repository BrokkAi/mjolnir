[package]
name = "brokk-mj-session-runtime"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Mjolnir's daemon-side ownership of running sessions: relay actors, worker recovery and credential sync"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_session_runtime"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript.workspace = true
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
mj-worker-staging.workspace = true
mj-worker-launch.workspace = true
mj-session-types.workspace = true
mj-sessionwiki.workspace = true
mj-import.workspace = true
mj-accounts.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures = "0.3"
getrandom.workspace = true
libc.workspace = true
reqwest.workspace = true
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime" }
tempfile.workspace = true
