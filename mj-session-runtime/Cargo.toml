[package]
name = "brokk-mj-session-runtime"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Mjolnir's daemon-side ownership of running sessions: relay actors, worker recovery and credential sync"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_session_runtime"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-targets/test-hooks", "mj-store/test-hooks", "mj-accounts/test-hooks", "mj-import/test-hooks", "mj-sessionwiki/test-hooks", "mj-worker-staging/test-hooks"]
# Exposes the shared test fixtures to the tests of the crates above.
test-support = ["mj-core/test-hooks", "mj-targets/test-support", "mj-store/test-support", "mj-accounts/test-support", "mj-import/test-support", "mj-sessionwiki/test-support", "mj-worker-staging/test-support"]

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript = { workspace = true, features = ["github-history"] }
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
mj-worker-staging.workspace = true
mj-session-types.workspace = true
mj-sessionwiki.workspace = true
mj-import.workspace = true
mj-accounts.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures = "0.3"
getrandom.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "query", "stream"] }
ring.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat", "io"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
mj-targets = { workspace = true, features = ["test-support"] }
mj-store = { workspace = true, features = ["test-support"] }
mj-worker-staging = { workspace = true, features = ["test-support"] }
mj-sessionwiki = { workspace = true, features = ["test-support"] }
mj-import = { workspace = true, features = ["test-support"] }
mj-accounts = { workspace = true, features = ["test-support"] }
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime", features = ["test-hooks"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
