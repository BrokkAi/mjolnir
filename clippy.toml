# Keep the TUI legible on terminal themes we have never seen.
#
# Raw RGB foregrounds on an unknown terminal background can make text
# unreadable. Live views use mj_chat::theme, which chooses foregrounds and
# paints their matching backgrounds together.
#
# Code that legitimately constructs RGB carries a scoped
# `#[allow(clippy::disallowed_methods)]` with a reason:
#
#   * `theme::rgb` — defines matching foreground/background pairs.
#   * `spinner::ink_color` — derives the scan gradient over painted surfaces.
#   * `docs_screenshots::color_hex` — reproduces captured colors in SVG.
disallowed-methods = [
    { path = "ratatui::style::Color::Rgb", reason = "Use mj_chat::theme colors with their matching painted background; raw RGB over an unknown terminal background can be unreadable." },
    { path = "ratatui::style::Color::Indexed", reason = "Use mj_chat::theme colors, or justify a scoped allowance for a captured or derived color." },
    { path = "ratatui::style::Stylize::white", reason = "Use the shared theme's text style and matching background. Hardcoded white is invisible on a light terminal." },
    { path = "ratatui::style::Stylize::black", reason = "Use the shared theme's text style and matching background. Hardcoded black is invisible on a dark terminal." },
    # Piping stdin *and* stdout/stderr to a child, then writing stdin before
    # wait_with_output, deadlocks once a pipe buffer fills: the child blocks
    # writing output nobody is draining yet, so it stops reading stdin, so the
    # parent's write blocks too. Use mj_core::subprocess::run_with_input,
    # which feeds stdin from a thread while draining output concurrently, or
    # justify a scoped #[allow(clippy::disallowed_methods)] when stdin is
    # Stdio::null() (nothing writes while output drains, so it cannot deadlock).
    { path = "std::process::Child::wait_with_output", reason = "write-then-wait deadlocks once a pipe buffer fills; use the shared run_with_input helper (or justify with an explicit allow)" },
    { path = "tokio::process::Child::wait_with_output", reason = "write-then-wait deadlocks once a pipe buffer fills; use the shared run_with_input helper (or justify with an explicit allow)", allow-invalid = true },
]
