# Plain Cargo commands build for the current host so local development works
# without a `--target` override. Release and worker builds select their static
# musl target explicitly.

# rust-lld ships with the toolchain and links the static musl binary in a
# fraction of GNU ld's time (measured: edit-to-binary 13.6s -> 6.0s).
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
