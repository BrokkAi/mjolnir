[tools]
"aqua:aws-cli" = "latest"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:flamegraph" = "0.6.14"
"cargo:samply" = "0.13.1"
go = "1.27.3"
java = "25"
node = "24"
python = "3"
uv = "0.12.20"
rust = { version = "1.99.1", components = "rustfmt,clippy,llvm-tools-preview", targets = "x86_64-unknown-linux-musl,aarch64-unknown-linux-musl" }

[env]
PLAYWRIGHT_BROWSERS_PATH = "/opt/ms-playwright"
RUSTUP_HOME = "/opt/rustup"
CARGO_HOME = "/opt/cargo"

[settings]
idiomatic_version_file_enable_tools = ["rust", "node", "python", "go"]

[hooks]
postinstall = "npx --yes playwright@1.62.1 install --with-deps chromium-headless-shell"

[bootstrap.packages]
"apt:bash" = "*"
"apt:build-essential" = "*"
"apt:ca-certificates" = "*"
"apt:clang" = "*"
"apt:cmake" = "*"
"apt:curl" = "*"
"apt:docker.io" = "*"
"apt:eatmydata" = "*"
"apt:fd-find" = "*"
"apt:file" = "*"
"apt:git" = "*"
"apt:gh" = "*"
"apt:heaptrack" = "*"
"apt:jq" = "*"
"apt:lcov" = "*"
"apt:less" = "*"
"apt:libasound2-dev" = "*"
"apt:libssl-dev" = "*"
"apt:mold" = "*"
"apt:musl-tools" = "*"
"apt:openssh-client" = "*"
"apt:patch" = "*"
"apt:pkg-config" = "*"
"apt:podman-remote" = "*"
"apt:procps" = "*"
"apt:python3" = "*"
"apt:python3-dev" = "*"
"apt:python3-pip" = "*"
"apt:python3-venv" = "*"
"apt:ripgrep" = "*"
"apt:rsync" = "*"
"apt:sudo" = "*"
"apt:time" = "*"
"apt:tmux" = "*"
"apt:unzip" = "*"
"apt:zip" = "*"
