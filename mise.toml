[tools]
# mise installs `cargo:` tools with cargo-binstall when it is present, which
# downloads prebuilt release binaries instead of compiling each tool from
# source (minutes per session otherwise). flamegraph has no prebuilt release
# and still compiles; samply's releases are not in binstall's layout, so it
# comes from the aqua registry.
"aqua:cargo-bins/cargo-binstall" = "1.27.0"
"aqua:aws-cli" = "latest"
# Ubuntu Noble's apt gh is 2.45.0, which fails against GitHub's sunset
# projectCards GraphQL field (fixed in gh 2.82.1).
"aqua:cli/cli" = "2.105.0"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:flamegraph" = "0.6.14"
"aqua:mstange/samply" = "0.13.1"
go = "1.27.3"
java = "25"
node = "24"
python = "3"
uv = "0.12.20"
rust = { version = "1.99.1", components = "rustfmt,clippy,llvm-tools-preview", targets = "x86_64-unknown-linux-musl,aarch64-unknown-linux-musl" }

[env]
PLAYWRIGHT_BROWSERS_PATH = "/opt/ms-playwright"
RUSTUP_HOME = "/opt/rustup"
CARGO_HOME = "/opt/cargo"

[settings]
idiomatic_version_file_enable_tools = ["rust", "node", "python", "go"]

[hooks]
# mise runs this hook after every `mise install`, even when nothing was
# installed, and `--with-deps` runs apt-get. Skip it when the headless shell
# for this Playwright version (revision 1234 for 1.62.1; update both numbers
# together) launches, which proves the download completed and its system
# libraries are present. Playwright installs it under chrome-headless-shell-linux64
# on x86_64 and under chrome-linux on arm64. `--force` reinstalls over a partial download, which
# Playwright would otherwise skip because its completion marker exists.
postinstall = "for shell in /opt/ms-playwright/chromium_headless_shell-1234/chrome-headless-shell-linux64/chrome-headless-shell /opt/ms-playwright/chromium_headless_shell-1234/chrome-linux/headless_shell; do \"$shell\" --version >/dev/null 2>&1 && exit 0; done; npx --yes playwright@1.62.1 install --force --with-deps chromium-headless-shell"

[bootstrap.packages]
"apt:bash" = "*"
"apt:build-essential" = "*"
"apt:ca-certificates" = "*"
"apt:clang" = "*"
"apt:cmake" = "*"
"apt:curl" = "*"
"apt:docker.io" = "*"
"apt:eatmydata" = "*"
"apt:fd-find" = "*"
"apt:file" = "*"
"apt:git" = "*"
# Pre-clone `gh auth git-credential` fallback for images built by older mj
# versions, which do not populate /opt/mj-image/bin. On current images
# /opt/mise/shims/gh and /opt/mj-image/bin/gh both precede /usr/bin/gh, so
# gh 2.105.0 (the [tools] entry above) runs everywhere.
"apt:gh" = "*"
"apt:heaptrack" = "*"
"apt:jq" = "*"
"apt:lcov" = "*"
"apt:less" = "*"
"apt:libasound2-dev" = "*"
"apt:libssl-dev" = "*"
"apt:mold" = "*"
"apt:musl-tools" = "*"
"apt:openssh-client" = "*"
"apt:patch" = "*"
"apt:pkg-config" = "*"
"apt:podman-remote" = "*"
"apt:procps" = "*"
"apt:python3" = "*"
"apt:python3-dev" = "*"
"apt:python3-pip" = "*"
"apt:python3-venv" = "*"
"apt:ripgrep" = "*"
"apt:rsync" = "*"
"apt:sudo" = "*"
"apt:time" = "*"
"apt:tmux" = "*"
"apt:unzip" = "*"
"apt:zip" = "*"
