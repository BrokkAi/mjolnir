[package]
name = "brokk-mj-worker-runtime"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Target-side worker runtime library for Mjolnir sessions"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_worker"

[lints]
workspace = true

[dependencies]
jsonc-parser.workspace = true
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
reqwest.workspace = true
rustls.workspace = true
rusqlite.workspace = true
getrandom.workspace = true
flate2.workspace = true
sha2.workspace = true
mj-core.workspace = true
mj-review.workspace = true
mj-checkpoint.workspace = true
mj-transcript.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
axum.workspace = true
hex = "0.4"
hmac.workspace = true
# Use the workspace reqwest rustls backend and ring provider.
mbx-cache-core = { version = "0.21", default-features = false }
mbx-cache-protocol = "0.5"
quick-xml = { version = "0.41", features = ["serialize"] }
socket2 = { version = "0.6", features = ["all"] }
url.workspace = true

# Mach time base for `proc_pid_rusage` CPU ticks; `libc` deprecated its own
# bindings in favour of this crate.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[dev-dependencies]
proptest = "1"
tempfile.workspace = true
