[package]
name = "brokk-mj-worker"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Target-side worker runtime for Mjolnir sessions"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_worker"

[[bin]]
name = "mj-worker"
path = "src/main.rs"

[features]
default = []
test-hooks = ["mj-core/test-hooks"]

[lints]
workspace = true

[dependencies]
rusqlite.workspace = true
getrandom.workspace = true
flate2.workspace = true
sha2.workspace = true
mj-core.workspace = true
mj-review.workspace = true
mj-checkpoint.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
# Projection is used only to verify relay replay in local tests.
mj-transcript = { path = "../mj-transcript", package = "brokk-mj-transcript" }
proptest = "1"
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-controller = { path = "../mj-controller", package = "brokk-mj-controller" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
