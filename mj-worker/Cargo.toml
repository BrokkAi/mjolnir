[package]
name = "brokk-mj-worker-runtime"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Target-side worker runtime library for Mjolnir sessions"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_worker"

[features]
default = []
test-hooks = ["mj-core/test-hooks"]

[lints]
workspace = true

[dependencies]
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
rusqlite.workspace = true
getrandom.workspace = true
flate2.workspace = true
sha2.workspace = true
mj-core.workspace = true
mj-review.workspace = true
mj-checkpoint.workspace = true
mj-transcript.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tempfile.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
axum = { workspace = true, default-features = false, features = ["http1", "json", "tokio"] }
hex = "0.4"
hmac.workspace = true
# Use the workspace reqwest rustls backend and ring provider.
mbx-cache-core = { version = "0.21", default-features = false }
mbx-cache-protocol = "0.5"
quick-xml = { version = "0.41", features = ["serialize"] }
socket2 = { version = "0.6", features = ["all"] }
url = "2"
tokio-util = { workspace = true, features = ["io"] }

# Mach time base for `proc_pid_rusage` CPU ticks; `libc` deprecated its own
# bindings in favour of this crate.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[dev-dependencies]
mj-build-cache = { path = "../mj-build-cache", package = "brokk-mj-build-cache" }
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
proptest = "1"
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-controller = { path = "../mj-controller", package = "brokk-mj-controller" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
