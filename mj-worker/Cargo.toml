[package]
name = "brokk-mj-worker"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Target-side worker runtime for Mjolnir sessions"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_worker"

[[bin]]
name = "mj-worker"
path = "src/main.rs"

[features]
default = []
test-hooks = ["mj-core/test-hooks"]

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
rusqlite.workspace = true
getrandom.workspace = true
flate2.workspace = true
sha2.workspace = true
mj-core.workspace = true
mj-review.workspace = true
mj-checkpoint.workspace = true
mj-transcript.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tempfile.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

# Mach time base for `proc_pid_rusage` CPU ticks; `libc` deprecated its own
# bindings in favour of this crate.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks"] }
proptest = "1"
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-controller = { path = "../mj-controller", package = "brokk-mj-controller" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
