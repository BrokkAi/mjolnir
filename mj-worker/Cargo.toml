[package]
name = "brokk-mj-worker"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Target-side worker runtime for Mjolnir sessions"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_worker"

[[bin]]
name = "mj-worker"
path = "src/main.rs"

[features]
default = []
test-hooks = ["mj-core/test-hooks"]

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
getrandom = "0.3"
flate2 = "1"
sha2 = "0.10"
zstd = "0.13"
regex = "1"
mj-core.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
proptest = "1"
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-controller = { path = "../mj-controller", package = "brokk-mj-controller" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
