[package]
name = "brokk-mj-store"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "The Mjolnir daemon's database: schema, migrations and session records"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_store"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-targets/test-hooks"]
# Exposes the shared test fixtures to the tests of the crates above.
test-support = ["mj-core/test-hooks", "mj-targets/test-support"]

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript = { workspace = true, features = ["github-history"] }
mj-client.workspace = true
mj-targets.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
futures = "0.3"
ring.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
mj-review = { path = "../mj-review", package = "brokk-mj-review" }
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
mj-targets = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
