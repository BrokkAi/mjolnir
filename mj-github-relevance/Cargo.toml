[package]
name = "brokk-mj-github-relevance"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "On-device classifier that decides which GitHub events matter to a Mjolnir session"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_github_relevance"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript.workspace = true
anyhow.workspace = true
chrono.workspace = true
flate2.workspace = true
futures = "0.3"
half = "2"
indexmap = "2"
libloading = "0.9"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-23", "directml", "coreml", "cuda", "half"] }
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tar.workspace = true
tempfile.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
mj-targets.workspace = true
axum.workspace = true
tempfile.workspace = true
