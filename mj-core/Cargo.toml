[package]
name = "brokk-mj-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Session control plane for ACP coding agents"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true
readme.workspace = true
include = [
    "build.rs",
    "src/**/*.rs",
    "tests/fixtures/fake-command.sh",
    "tests/jev-gates.json",
    # Turn-classifier questions shared with the hosted proxy.
    "src/activity/verdict_questions.json",
    "src/help_search/question.json",
    "src/continuation/questions.json",
    # Recorded ACP bridge traffic the step-clock tests replay.
    "src/**/testdata/**/*.jsonl",
    # Mjolnir-authored skills embedded with `include_str!`.
    "assets/skills/**/*.md",
    # Delegation guidance embedded with `include_str!` by `subagent`.
    "assets/subagent-delegation.md",
    "Cargo.toml",
    "Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "mj_core"

[features]
default = []
golden = []
test-hooks = []

[lints]
workspace = true

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
bytesize = "2"
chrono.workspace = true
dirs.workspace = true
flate2.workspace = true
getrandom.workspace = true
imbl.workspace = true
libc.workspace = true
memchr.workspace = true
regex = "1"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
similar = "2.7"
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
# Measures local free space where there is no POSIX `df`, and detaches
# background processes from the launcher's console and handles.
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
