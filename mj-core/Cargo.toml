[package]
name = "mj-core"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Frontend-neutral ACP runtime and session kernel for Mjolnir"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
