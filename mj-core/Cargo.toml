[package]
name = "brokk-mj-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Frontend-neutral ACP runtime and session kernel for Mjolnir"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = true

[dependencies]
base64 = "0.22"
getrandom = "0.3"
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
flate2 = "1"
futures = "0.3"
iana-time-zone = "0.1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
rmcp = { version = "1", features = ["server", "macros", "transport-async-rw"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
semver = "1"
serde_json = "1"
shell-words = "1"
signal-hook = "0.3"
similar = "2.7"
tracing = "0.1"
tempfile = "3"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.8"
unicode-width = "0.2.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
