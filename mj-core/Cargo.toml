[package]
name = "brokk-mj-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Session control plane for ACP coding agents"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true
readme.workspace = true
include = [
    "build.rs",
    "src/**/*.rs",
    "tests/fixtures/*.sh",
    "tests/fixtures/claude-antigravity-models.json",
    # Turn-classifier questions shared with the hosted proxy.
    "src/activity/question_locator.json",
    "src/activity/eot_glide_questions.json",
    "src/activity/eot_glide_fresh_sample.json",
    "src/github_item/questions_v2.json",
    "src/github_item/ettin-tokenizer.json",
    # Recorded ACP bridge traffic the step-clock tests replay.
    "src/**/testdata/**/*.jsonl",
    # Mjolnir-authored skills embedded with `include_str!`.
    "assets/skills/**/*.md",
    # Review instructions embedded with `include_str!` by session setup.
    "assets/instructions/review_rubric.md",
    "assets/instructions/brief_writer.md",
    # Delegation guidance embedded with `include_str!` by `subagent`.
    "assets/subagent-delegation.md",
    "assets/supervisor-delegation.md",
    # OpenCode provider environment embedded with `include_str!` by the
    # harness runtime config.
    "assets/opencode-provider-environment.txt",
    # Pinned managed harness packages and verified runtime manifests.
    "assets/harnesses/**",
    "assets/antigravity/runtime.json",
    "assets/grok/runtime.json",
    "assets/kimi/runtime.json",
    "assets/mise/runtime.json",
    "assets/muse/runtime.json",
    "assets/node/runtime.json",
    "assets/opencode/runtime.json",
    "Cargo.toml",
    "Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "mj_core"

[features]
# Lets a test binary, which has no `main` to install one, read the build
# identity compiled into this crate.
test-identity = []
github-history = ["dep:tokenizers"]
default = []
golden = []
test-hooks = ["test-identity"]

[lints]
workspace = true

[dependencies]
zstd = { version = "0.13", default-features = false }
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
bytesize = "2"
# Directory handles that keep project-memory sync below its root even when
# the tree is changed underneath it (#1419).
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono.workspace = true
dirs.workspace = true
flate2.workspace = true
getrandom.workspace = true
imbl.workspace = true
jsonc-parser = { version = "0.34", features = ["serde"] }
libc.workspace = true
memchr.workspace = true
regex = "1"
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }
reqwest.workspace = true
httpdate = "1"
ruzstd.workspace = true
rustls.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_ignored.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "2.7"
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
url.workspace = true
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
# Measures local free space where there is no POSIX `df`, and detaches
# background processes from the launcher's console and handles.
windows-sys = { workspace = true, features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
] }


[dev-dependencies]
tempfile.workspace = true
tiny_http = "0.12"
tokio = { workspace = true, features = ["test-util"] }
