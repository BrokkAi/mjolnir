[package]
name = "brokk-mj-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native desktop application for Mjolnir"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = true

[lib]
name = "mj_desktop"

[[bin]]
name = "mj-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
rcgen = "0.13"

[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", target_env = "gnu")))'.dependencies]
hel.workspace = true
mj-controller.workspace = true
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
tao = { version = "0.35", default-features = false, features = ["rwh_06", "x11"] }
tokio = { version = "1", features = ["full"] }
webbrowser = "1.2"
wry = "0.55.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6.4", features = ["exception", "disable-encoding-assertions"] }
objc2-foundation = { version = "0.3.0", default-features = false, features = ["std", "NSData", "NSDictionary", "NSEnumerator", "NSHTTPCookie", "NSObject", "NSString", "NSURL", "NSURLAuthenticationChallenge", "NSURLCredential", "NSURLProtectionSpace", "NSURLRequest", "NSURLSession"] }
objc2-web-kit = { version = "0.3.0", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKHTTPCookieStore", "WKNavigationAction", "WKNavigationDelegate", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
gio = "0.18"
soup = { package = "soup3", version = "0.5" }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
