[package]
name = "brokk-mj-worker"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Target-side worker program for Mjolnir sessions"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

# The program is its own package so that what only it needs (its build stamp)
# is not a dependency of the worker library, which other crates' tests use.
[[bin]]
name = "mj-worker"
path = "src/main.rs"

[features]
default = []
test-hooks = []

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-harness-install.workspace = true
mj-build-id.workspace = true
mj-checkpoint.workspace = true
mj-worker.workspace = true
mj-worker-mcp.workspace = true
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mj-microvm.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
agent-client-protocol.workspace = true
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-targets = { path = "../mj-targets", package = "brokk-mj-targets" }
tempfile.workspace = true
