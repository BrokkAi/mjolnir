accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "LGPL-3.0-only",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

# Union of shipped native targets plus the GNU target retained only for the
# optional voice worker. Keeping the full workspace here ensures that
# target-specific dependencies remain visible.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-linux-android",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# libmimalloc-sys vendors upstream mimalloc under c_src. cargo-about's
# filesystem scan otherwise chooses nondeterministically between that license
# and the Rust wrapper's package license; the native license is carried by the
# generated supplemental notice.
[libmimalloc-sys.clarify]
license = "MIT"

[[libmimalloc-sys.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "a08554fab028af3af047e8588d32d019662c1b1bf07959a195a2f75fe340726b"

# ureq is dual-licensed and cargo-about can otherwise choose a different
# accepted license file on different platforms.
[ureq.clarify]
license = "Apache-2.0"

[[ureq.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4"
