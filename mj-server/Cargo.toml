[package]
name = "brokk-mj-server"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "HTTP API and web viewer server for the Mjolnir daemon"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_server"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-harness-install.workspace = true
mj-transcript.workspace = true
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-accounts.workspace = true
mj-build-cache.workspace = true
mj-import.workspace = true
mj-profile-catalog.workspace = true
mj-session-runtime.workspace = true
mj-session-types.workspace = true
mj-sessionwiki.workspace = true
mj-store.workspace = true
mj-targets.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
futures = "0.3"
getrandom.workspace = true
# HMAC-SHA256 signs the stateless remote-viewer session cookie (keyed on a
# persisted signing key); pairs with the existing `sha2`.
hmac = "0.13"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
mj-github-relevance.workspace = true
mj-review.workspace = true
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime" }
http-body-util = "0.1"
rusqlite.workspace = true
