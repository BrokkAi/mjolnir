[package]
name = "brokk-mj-server"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "HTTP API and web viewer server for the Mjolnir daemon"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_server"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-controller/test-hooks"]
# Counters that tests in the daemon read to prove a snapshot was not rebuilt.
test-support = []

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-transcript = { workspace = true, features = ["github-history"] }
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-controller.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
futures = "0.3"
getrandom.workspace = true
# HMAC-SHA256 signs the stateless remote-viewer session cookie (keyed on a
# persisted signing key); pairs with the existing `sha2`.
hmac = "0.13"
rustls.workspace = true
sessionwiki.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["compat", "io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
mj-controller = { workspace = true, features = ["test-support"] }
mj-review.workspace = true
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker", features = ["test-hooks"] }
http-body-util = "0.1"
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
