[package]
name = "brokk-mj-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native desktop shell binary for Mjolnir"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = true

# The webview is the only thing that links WebKitGTK on Linux. Keeping it in its
# own binary is what lets `mj` stay free of that dependency, so `mj server` and
# the TUI run on a headless machine with no desktop packages installed.
[[bin]]
name = "mj-app"
path = "src/main.rs"

[dependencies]
mj-core.workspace = true
mj-remote.workspace = true
mj-desktop.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
