[package]
name = "brokk-mjolnir"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Mjolnir: session control plane for ACP coding agents (installs the `mj` binary)"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lints]
workspace = true

[[bin]]
name = "mj"
path = "src/main.rs"

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-controller/test-hooks", "mj-chat/test-hooks"]

[dependencies]
mj-core.workspace = true
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-controller.workspace = true
mj-chat.workspace = true
mj-tui.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
crossterm = { workspace = true, features = ["osc52"] }
dirs.workspace = true
# The event loop waits on every warm conversation at once through select_all.
futures = "0.3"
libc.workspace = true
ratatui.workspace = true
reqwest = { workspace = true, features = ["json", "query"] }
# The API client pins the certificate the daemon publishes for its viewer.
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sysinfo.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks"] }
# The API client test answers itself from a canned in-process router.
axum.workspace = true
# The pinned-certificate tests serve HTTPS with generated certificates.
axum-server.workspace = true
rcgen = "0.13"
libc.workspace = true
# The store-divergence test migrates the daemon's store from outside the
# daemon, which is exactly what the incident it reproduces did.
rusqlite.workspace = true
tempfile.workspace = true
# Project cursor-addressed PTY redraws into the screen visible to the user.
vte = { version = "0.14", default-features = false }
# `start_paused` drives the force-destroy preemption timeout instantly.
tokio = { workspace = true, features = ["test-util"] }
