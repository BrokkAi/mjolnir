# Indexes the Rust workspace for the Go port (see go/README.md). This is a
# standalone package, not a workspace member: the empty [workspace] table keeps
# Cargo from attaching it to the repository workspace, so it never affects the
# product build, its lockfile, or its crate checks.
[package]
name = "rsindex"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
