[package]
name = "brokk-mj-accounts"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Harness logins, quota and usage readers for Mjolnir profiles"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_accounts"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-targets/test-hooks", "mj-store/test-hooks"]
# Exposes the shared test fixtures to the tests of the crates above.
test-support = ["mj-core/test-hooks", "mj-targets/test-support", "mj-store/test-support"]

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-client.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
anvil-client.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
futures = "0.3"
getrandom.workspace = true
libc.workspace = true
portable-pty = "0.9"
rayon.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "query", "stream"] }
rusqlite.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat", "io"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
mj-targets = { workspace = true, features = ["test-support"] }
mj-store = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
