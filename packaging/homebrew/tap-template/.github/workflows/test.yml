name: Test formula

on:
  push:
    branches: [ 'main' ]
  pull_request: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Add Homebrew to PATH
      if: runner.os == 'Linux'
      run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

    - name: Install Linux audio dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libasound2t64 || \
          sudo apt-get install --no-install-recommends --assume-yes libasound2

    - name: Install the formula
      run: brew install --formula ./Formula/mjolnir.rb

    - name: Run the formula test
      run: brew test mjolnir

    - name: Check mj runs
      run: mj --version
