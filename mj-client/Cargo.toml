[package]
name = "brokk-mj-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Client-facing contracts and shared presentation helpers for Mjolnir"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_client"

[lints]
workspace = true

[dependencies]
libc = "0.2"
sysinfo = "0.32"
sha2 = "0.10"
serde_json = "1"
mj-core.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
anvil-client.workspace = true
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
