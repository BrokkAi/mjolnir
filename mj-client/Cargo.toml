[package]
name = "brokk-mj-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license-file.workspace = true
license.workspace = true
description = "Client-facing contracts and shared presentation helpers for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_client"

[lints]
workspace = true

[dependencies]
libc.workspace = true
sysinfo.workspace = true
sha2.workspace = true
serde_json.workspace = true
mj-core.workspace = true
mj-transcript.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
anvil-client.workspace = true
getrandom.workspace = true
image = { workspace = true, features = ["jpeg", "webp"] }
serde = { workspace = true, features = ["rc"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }
