[package]
name = "brokk-mj-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Client-facing contracts and shared presentation helpers for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_client"

[lints]
workspace = true

[dependencies]
bytes.workspace = true
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
subtle = "2.6"
tokio-util.workspace = true
reqwest.workspace = true
rustls.workspace = true
url.workspace = true
libc.workspace = true
sysinfo.workspace = true
sha2.workspace = true
hmac.workspace = true
serde_json.workspace = true
mj-core.workspace = true
mj-transcript.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
getrandom.workspace = true
image.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
semver.workspace = true
chrono.workspace = true
tempfile.workspace = true

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime" }
