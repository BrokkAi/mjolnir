[package]
name = "brokk-mj-daemon"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "Daemon, HTTP API and web viewer server for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_daemon"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[lints]
workspace = true

[dependencies]
portable-pty = "0.9"
sysinfo.workspace = true
mj-core.workspace = true
mj-review.workspace = true
mj-transcript.workspace = true
mj-checkpoint.workspace = true
mj-client.workspace = true
agent-client-protocol.workspace = true
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
chrono.workspace = true
futures = "0.3"
getrandom.workspace = true
# HMAC-SHA256 signs the stateless remote-viewer session cookie (keyed on a
# persisted signing key); pairs with the existing `sha2`.
hmac = "0.13"
libc.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
sessionwiki.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
anvil-client.workspace = true
mj-controller.workspace = true
mj-setup.workspace = true
mj-server.workspace = true
mj-review-host.workspace = true
mj-github-relevance.workspace = true

[dev-dependencies]
# Cross-runtime fixtures stay local; versionless dev dependencies are not published.
mj-worker = { path = "../mj-worker", package = "brokk-mj-worker-runtime" }
tar.workspace = true
http-body-util = "0.1"
tempfile.workspace = true
