[package]
name = "brokk-mj-setup"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
description = "First-run discovery and the doctor's diagnostics for Mjolnir"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lib]
name = "mj_setup"
# The crate has no doc tests; looking for them makes rustdoc compile it again.
doctest = false

[features]
default = []
test-hooks = ["mj-core/test-hooks", "mj-controller/test-hooks"]
# Exposes the shared test fixtures to the tests of the crates above.
test-support = ["mj-core/test-hooks", "mj-controller/test-support"]

[lints]
workspace = true

[dependencies]
mj-core.workspace = true
mj-checkpoint.workspace = true
mj-client.workspace = true
mj-targets.workspace = true
mj-store.workspace = true
mj-accounts.workspace = true
mj-import.workspace = true
mj-controller.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
mj-core = { workspace = true, features = ["test-hooks", "golden"] }
mj-targets = { workspace = true, features = ["test-support"] }
mj-store = { workspace = true, features = ["test-support"] }
mj-accounts = { workspace = true, features = ["test-support"] }
mj-controller = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
