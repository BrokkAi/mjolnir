[package]
name = "mj-remote"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Remote-control server and web viewer for Mjolnir"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[dependencies]
anyhow = "1"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
