name: Cache Rust build
description: Restore compatible build outputs and refresh them after successful commits
inputs:
  lane:
    description: Independent build job and target namespace
    required: true
  build-paths:
    description: Build directories to cache, excluding runtime test evidence
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ inputs.build-paths }}
        key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lane }}-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/macos.yml', '.github/actions/cache-rust/action.yml', 'rust-toolchain*', '.cargo/config*', 'scripts/setup-linux-cli-toolchain.sh') }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lane }}-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/macos.yml', '.github/actions/cache-rust/action.yml', 'rust-toolchain*', '.cargo/config*', 'scripts/setup-linux-cli-toolchain.sh') }}-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}-
          rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.lane }}-${{ hashFiles('.github/workflows/ci.yml', '.github/workflows/macos.yml', '.github/actions/cache-rust/action.yml', 'rust-toolchain*', '.cargo/config*', 'scripts/setup-linux-cli-toolchain.sh') }}-
