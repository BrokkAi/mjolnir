name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Tags are not covered by the branch and pull request triggers on CI, so
  # nothing else re-checks the tagged tree. Collecting coverage runs the whole
  # workspace test suite, so this gates the release on the tests passing and on
  # the coverage baseline holding. Everything downstream of the release
  # workflow, crates.io and npm included, inherits the gate.
  coverage:
    name: Coverage gate
    uses: ./.github/workflows/coverage.yml

  build-linux:
    name: Build x86_64-unknown-linux-gnu
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Build voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target x86_64-unknown-linux-gnu

      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp "target/x86_64-unknown-linux-gnu/release/mj" "$name/"
          cp "target/x86_64-unknown-linux-gnu/release/mj-voice-worker" "$name/"
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  build-linux-arm64:
    name: Build aarch64-unknown-linux-gnu
    needs: coverage
    # Build natively on a GitHub-hosted arm64 runner instead of cross. The
    # cross images (ghcr.io/cross-rs/aarch64-unknown-linux-gnu, Ubuntu 20.04 /
    # GCC 9 even on the main tag) ship a libstdc++ too old to link the
    # GCC 11+ symbols in the prebuilt sherpa-onnx aarch64 static libs
    # (std::__throw_bad_array_new_length, std::__cxx11::basic_stringstream,
    # std::filesystem::path). ubuntu-24.04-arm ships GCC 13, matching the
    # native build path that already succeeds on x86_64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu

      - name: Build voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target aarch64-unknown-linux-gnu

      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu"
          mkdir "$name"
          cp "target/aarch64-unknown-linux-gnu/release/mj" "$name/"
          cp "target/aarch64-unknown-linux-gnu/release/mj-voice-worker" "$name/"
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-unknown-linux-gnu
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  build-android:
    name: Build aarch64-linux-android
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Export Android NDK toolchain
        shell: bash
        run: |
          ndk_path='${{ steps.setup-ndk.outputs.ndk-path }}'
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-linux-android

      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-aarch64-linux-android"
          mkdir "$name"
          cp "target/aarch64-linux-android/release/mj" "$name/"
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-android
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  build-windows:
    name: Build x86_64-pc-windows-msvc
    needs: coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target x86_64-pc-windows-msvc

      - name: Package archive
        shell: pwsh
        run: |
          $name = "brokk-mjolnir-${env:GITHUB_REF_NAME}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\mj.exe" -Destination $name
          Copy-Item "target\x86_64-pc-windows-msvc\release\mj-voice-worker.exe" -Destination $name
          Copy-Item "README.md" -Destination $name
          Copy-Item "LICENSE" -Destination $name
          New-Item -ItemType Directory -Path "$name\licenses" | Out-Null
          $legalFiles = @("licenses\SOURCE.md", "licenses\OFL-1.1.md", "licenses\THIRD_PARTY_LICENSES.html", "licenses\SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt")
          Copy-Item $legalFiles -Destination "$name\licenses"
          Copy-Item "licenses\native" -Destination "$name\licenses" -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Path "$name.zip.sha256" -NoNewline

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-pc-windows-msvc
          path: |
            brokk-mjolnir-*.zip
            brokk-mjolnir-*.zip.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS universal
    needs: coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build x86_64 binaries
        run: cargo build --release --locked --target x86_64-apple-darwin --bin mj --bin mj-computer-host

      - name: Build x86_64 voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target x86_64-apple-darwin

      - name: Build aarch64 binaries
        run: cargo build --release --locked --target aarch64-apple-darwin --bin mj --bin mj-computer-host

      - name: Build aarch64 voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/mj \
            target/aarch64-apple-darwin/release/mj \
            -output target/universal-apple-darwin/release/mj
          lipo -info target/universal-apple-darwin/release/mj
          lipo -create \
            target/x86_64-apple-darwin/release/mj-computer-host \
            target/aarch64-apple-darwin/release/mj-computer-host \
            -output target/universal-apple-darwin/release/mj-computer-host
          lipo -info target/universal-apple-darwin/release/mj-computer-host
          lipo -create \
            target/x86_64-apple-darwin/release/mj-voice-worker \
            target/aarch64-apple-darwin/release/mj-voice-worker \
            -output target/universal-apple-darwin/release/mj-voice-worker
          lipo -info target/universal-apple-darwin/release/mj-voice-worker

      # A stable Developer ID signature is part of Computer.app's macOS TCC
      # identity. Do not let a release fall back to an ad-hoc-signed bundle.
      - name: Import Developer ID certificate
        env:
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          : "${MACOS_DEVELOPER_ID_CERTIFICATE_BASE64:?missing MACOS_DEVELOPER_ID_CERTIFICATE_BASE64}"
          : "${MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD:?missing MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          : "${MACOS_DEVELOPER_ID_IDENTITY:?missing MACOS_DEVELOPER_ID_IDENTITY}"
          : "${MACOS_KEYCHAIN_PASSWORD:?missing MACOS_KEYCHAIN_PASSWORD}"
          certificate_path="$RUNNER_TEMP/mjolnir-developer-id.p12"
          keychain_path="$RUNNER_TEMP/mjolnir-signing.keychain-db"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F -- "$MACOS_DEVELOPER_ID_IDENTITY"

      - name: Package signed and notarized archive
        env:
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_SPECIFIC_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          : "${MACOS_DEVELOPER_ID_IDENTITY:?missing MACOS_DEVELOPER_ID_IDENTITY}"
          : "${MACOS_NOTARY_APPLE_ID:?missing MACOS_NOTARY_APPLE_ID}"
          : "${MACOS_NOTARY_APP_SPECIFIC_PASSWORD:?missing MACOS_NOTARY_APP_SPECIFIC_PASSWORD}"
          : "${MACOS_NOTARY_TEAM_ID:?missing MACOS_NOTARY_TEAM_ID}"
          name="brokk-mjolnir-${GITHUB_REF_NAME}-universal-apple-darwin"
          mkdir "$name"
          cp target/universal-apple-darwin/release/mj "$name/"
          mkdir -p "$name/Mjolnir Computer.app/Contents/MacOS"
          version="${GITHUB_REF_NAME#v}"
          sed "s/@VERSION@/$version/g" assets/macos/Mjolnir\ Computer.app/Contents/Info.plist > "$name/Mjolnir Computer.app/Contents/Info.plist"
          plutil -lint "$name/Mjolnir Computer.app/Contents/Info.plist"
          cp target/universal-apple-darwin/release/mj-computer-host "$name/Mjolnir Computer.app/Contents/MacOS/"
          bundle="$name/Mjolnir Computer.app"
          codesign --force --options runtime --timestamp --sign "$MACOS_DEVELOPER_ID_IDENTITY" "$bundle/Contents/MacOS/mj-computer-host"
          codesign --force --options runtime --timestamp --sign "$MACOS_DEVELOPER_ID_IDENTITY" "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          notarization_archive="$RUNNER_TEMP/Mjolnir Computer.app.zip"
          ditto -c -k --keepParent "$bundle" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" --apple-id "$MACOS_NOTARY_APPLE_ID" --password "$MACOS_NOTARY_APP_SPECIFIC_PASSWORD" --team-id "$MACOS_NOTARY_TEAM_ID" --wait
          xcrun stapler staple "$bundle"
          xcrun stapler validate "$bundle"
          cp target/universal-apple-darwin/release/mj-voice-worker "$name/"
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-apple-darwin
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-linux-arm64, build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/brokk-mjolnir-*.tar.gz
            artifacts/brokk-mjolnir-*.tar.gz.sha256
            artifacts/brokk-mjolnir-*.zip
            artifacts/brokk-mjolnir-*.zip.sha256

      # Events created with GITHUB_TOKEN do not start workflows, while crates.io
      # rejects trusted-publishing requests from the workflow_run event. An
      # explicit dispatch is both supported by GitHub and trusted by crates.io.
      - name: Dispatch crates.io publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --ref "$GITHUB_REF_NAME" \
            --raw-field release_tag="$GITHUB_REF_NAME" \
            --raw-field publish=true

      - name: Announce release on Discord
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: bash scripts/announce-discord-release.sh
