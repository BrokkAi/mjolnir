name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # Tags are not covered by the branch and pull request triggers on CI, so
  # nothing else re-checks the tagged tree. Collecting coverage runs the whole
  # workspace test suite, so this gates the release on the tests passing and on
  # the coverage baseline holding. Everything downstream of the release
  # workflow, crates.io and npm included, inherits the gate.
  coverage:
    name: Coverage gate
    uses: ./.github/workflows/coverage.yml

  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check tag against workspace versions
        run: node scripts/release-version.mjs check "$GITHUB_REF_NAME"

  # Session workers run inside disposable Linux targets (containers and
  # instances), so they are static musl builds of the mj binary regardless of
  # the controller's platform. Desktop bundles ship both architectures beside
  # the controller as mj-worker-<triple>, which is where the controller's
  # worker lookup expects them.
  build-worker-x64:
    name: Build worker x86_64-unknown-linux-musl
    needs: [coverage, verify-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes musl-tools

      - name: Build static worker
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --no-default-features --bin mj --target x86_64-unknown-linux-musl

      - name: Verify static binary
        run: |
          binary=target/x86_64-unknown-linux-musl/release/mj
          if readelf -lW "$binary" | grep 'Requesting program interpreter' >/dev/null; then
            echo 'Worker unexpectedly has a dynamic program interpreter' >&2
            exit 1
          fi
          if readelf -dW "$binary" | grep '(NEEDED)' >/dev/null; then
            echo 'Worker unexpectedly needs a dynamic library' >&2
            exit 1
          fi
          "$binary" --version

      - name: Upload worker
        uses: actions/upload-artifact@v7
        with:
          name: mj-worker-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/mj
          if-no-files-found: error

  build-worker-arm64:
    name: Build worker aarch64-unknown-linux-musl
    needs: [coverage, verify-version]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes musl-tools

      - name: Build static worker
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --no-default-features --bin mj --target aarch64-unknown-linux-musl

      - name: Verify static binary
        run: |
          binary=target/aarch64-unknown-linux-musl/release/mj
          if readelf -lW "$binary" | grep 'Requesting program interpreter' >/dev/null; then
            echo 'Worker unexpectedly has a dynamic program interpreter' >&2
            exit 1
          fi
          if readelf -dW "$binary" | grep '(NEEDED)' >/dev/null; then
            echo 'Worker unexpectedly needs a dynamic library' >&2
            exit 1
          fi
          "$binary" --version

      - name: Upload worker
        uses: actions/upload-artifact@v7
        with:
          name: mj-worker-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/mj
          if-no-files-found: error

  build-linux:
    name: Build x86_64-unknown-linux-gnu
    needs: [build-worker-x64, build-worker-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux desktop and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev libwebkit2gtk-4.1-dev

      - name: Build controller and desktop binaries
        run: cargo build --release --locked -p brokk-mjolnir -p brokk-mj-desktop --target x86_64-unknown-linux-gnu

      - name: Build voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target x86_64-unknown-linux-gnu

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*
          path: workers

      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp "target/x86_64-unknown-linux-gnu/release/mj" "$name/"
          cp "target/x86_64-unknown-linux-gnu/release/mj-desktop" "$name/"
          cp "target/x86_64-unknown-linux-gnu/release/mj-voice-worker" "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj "$name/mj-worker-aarch64-unknown-linux-musl"
          chmod 0755 "$name/mj" "$name/mj-desktop" "$name/mj-voice-worker" "$name"/mj-worker-*
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  build-linux-arm64:
    name: Build aarch64-unknown-linux-gnu
    needs: [build-worker-x64, build-worker-arm64]
    # Build natively on a GitHub-hosted arm64 runner instead of cross. The
    # cross images ship a libstdc++ too old to link the GCC 11+ symbols in the
    # prebuilt sherpa-onnx aarch64 static libs; ubuntu-24.04-arm ships GCC 13,
    # matching the native build path that already succeeds on x86_64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Linux desktop and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev libwebkit2gtk-4.1-dev

      - name: Build controller and desktop binaries
        run: cargo build --release --locked -p brokk-mjolnir -p brokk-mj-desktop --target aarch64-unknown-linux-gnu

      - name: Build voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target aarch64-unknown-linux-gnu

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*
          path: workers

      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu"
          mkdir "$name"
          cp "target/aarch64-unknown-linux-gnu/release/mj" "$name/"
          cp "target/aarch64-unknown-linux-gnu/release/mj-desktop" "$name/"
          cp "target/aarch64-unknown-linux-gnu/release/mj-voice-worker" "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj "$name/mj-worker-aarch64-unknown-linux-musl"
          chmod 0755 "$name/mj" "$name/mj-desktop" "$name/mj-voice-worker" "$name"/mj-worker-*
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-unknown-linux-gnu
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS universal
    needs: [build-worker-x64, build-worker-arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build x86_64 controller and desktop binaries
        run: cargo build --release --locked -p brokk-mjolnir -p brokk-mj-desktop --target x86_64-apple-darwin

      - name: Build x86_64 voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target x86_64-apple-darwin

      - name: Build aarch64 controller and desktop binaries
        run: cargo build --release --locked -p brokk-mjolnir -p brokk-mj-desktop --target aarch64-apple-darwin

      - name: Build aarch64 voice worker
        run: cargo build --release --locked -p brokk-mj-voice-worker --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/mj \
            target/aarch64-apple-darwin/release/mj \
            -output target/universal-apple-darwin/release/mj
          lipo -info target/universal-apple-darwin/release/mj
          lipo -create \
            target/x86_64-apple-darwin/release/mj-desktop \
            target/aarch64-apple-darwin/release/mj-desktop \
            -output target/universal-apple-darwin/release/mj-desktop
          lipo -info target/universal-apple-darwin/release/mj-desktop
          lipo -create \
            target/x86_64-apple-darwin/release/mj-voice-worker \
            target/aarch64-apple-darwin/release/mj-voice-worker \
            -output target/universal-apple-darwin/release/mj-voice-worker
          lipo -info target/universal-apple-darwin/release/mj-voice-worker

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*
          path: workers

      - name: Package archive
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-universal-apple-darwin"
          mkdir "$name"
          cp target/universal-apple-darwin/release/mj "$name/"
          cp target/universal-apple-darwin/release/mj-desktop "$name/"
          cp target/universal-apple-darwin/release/mj-voice-worker "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj "$name/mj-worker-aarch64-unknown-linux-musl"
          chmod 0755 "$name/mj" "$name/mj-desktop" "$name/mj-voice-worker" "$name"/mj-worker-*
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: universal-apple-darwin
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/brokk-mjolnir-*.tar.gz
            artifacts/brokk-mjolnir-*.tar.gz.sha256

      # Events created with GITHUB_TOKEN do not start workflows, while crates.io
      # rejects trusted-publishing requests from the workflow_run event. An
      # explicit dispatch is both supported by GitHub and trusted by crates.io.
      - name: Dispatch crates.io publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --ref "$GITHUB_REF_NAME" \
            --raw-field release_tag="$GITHUB_REF_NAME" \
            --raw-field publish=true

      - name: Announce release on Discord
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: bash scripts/announce-discord-release.sh
