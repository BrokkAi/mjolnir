name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Check tag against Cargo package versions
        run: |
          cargo metadata --locked --no-deps --format-version 1 |
            jq -e --arg version "${GITHUB_REF_NAME#v}" 'all(.packages[]; .version == $version)'

  # The full CI suite on the tagged commit. Builds run beside it; only
  # publication waits for it, so a release never depends on a branch CI run
  # that a later push cancelled.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-notices:
    name: Generate release notices
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install license report tool
        run: cargo install --locked cargo-about --version 0.9.1 --features cli
      - name: Generate notices for the tagged dependency graph
        run: |
          cargo fetch --locked
          mkdir -p target/release-notices
          cargo about generate --workspace --offline --config licenses/about.toml --locked --fail licenses/about.hbs -o target/release-notices/THIRD_PARTY_LICENSES.html
          node scripts/generate-supplemental-third-party-notices.mjs target/release-notices/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-notices
          path: target/release-notices/
          if-no-files-found: error

  # Session workers run inside disposable Linux targets (containers and
  # instances), so they are static musl builds of the dedicated worker binary
  # the controller's platform. Desktop bundles ship both architectures beside
  # the controller as mj-worker-<triple>, which is where the controller's
  # worker lookup expects them.
  build-worker-x64:
    name: Build worker x86_64-unknown-linux-musl
    needs: verify-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes musl-tools

      - name: Build static worker
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p brokk-mj-worker --bin mj-worker --target x86_64-unknown-linux-musl

      - name: Verify static binary
        run: |
          binary=target/x86_64-unknown-linux-musl/release/mj-worker
          if readelf -lW "$binary" | grep 'Requesting program interpreter' >/dev/null; then
            echo 'Worker unexpectedly has a dynamic program interpreter' >&2
            exit 1
          fi
          if readelf -dW "$binary" | grep '(NEEDED)' >/dev/null; then
            echo 'Worker unexpectedly needs a dynamic library' >&2
            exit 1
          fi
          "$binary" --version

      - name: Upload worker
        uses: actions/upload-artifact@v7
        with:
          name: mj-worker-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/mj-worker
          if-no-files-found: error

  build-worker-arm64:
    name: Build worker aarch64-unknown-linux-musl
    needs: verify-version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes musl-tools

      - name: Build static worker
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p brokk-mj-worker --bin mj-worker --target aarch64-unknown-linux-musl

      - name: Verify static binary
        run: |
          binary=target/aarch64-unknown-linux-musl/release/mj-worker
          if readelf -lW "$binary" | grep 'Requesting program interpreter' >/dev/null; then
            echo 'Worker unexpectedly has a dynamic program interpreter' >&2
            exit 1
          fi
          if readelf -dW "$binary" | grep '(NEEDED)' >/dev/null; then
            echo 'Worker unexpectedly needs a dynamic library' >&2
            exit 1
          fi
          "$binary" --version

      - name: Upload worker
        uses: actions/upload-artifact@v7
        with:
          name: mj-worker-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/mj-worker
          if-no-files-found: error

  build-linux:
    name: Build x86_64-unknown-linux-gnu
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux desktop and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Linux CLI toolchain
        run: bash scripts/setup-linux-cli-toolchain.sh

      - name: Build and verify glibc 2.28 CLI
        run: bash scripts/build-linux-cli.sh x86_64-unknown-linux-gnu

      - name: Build desktop and voice worker
        run: cargo build --release --locked -p brokk-mj-desktop -p brokk-mj-voice-worker --target x86_64-unknown-linux-gnu

      - name: Stage native binaries
        run: |
          mkdir native
          cp target/release-cli/x86_64-unknown-linux-gnu/release/mj native/
          cp target/x86_64-unknown-linux-gnu/release/mj-desktop target/x86_64-unknown-linux-gnu/release/mj-voice-worker native/

      - uses: actions/upload-artifact@v7
        with:
          name: native-x86_64-unknown-linux-gnu
          path: native/
          if-no-files-found: error

  package-x86_64-unknown-linux-gnu:
    name: Package x86_64-unknown-linux-gnu
    needs: [build-linux, build-macos, build-worker-x64, build-worker-arm64, release-notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-unknown-linux-gnu
          path: native

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*
          path: workers

      - name: Download generated notices
        uses: actions/download-artifact@v8
        with:
          name: release-notices
          path: release-notices

      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp "native/mj" "$name/"
          cp "native/mj-desktop" "$name/"
          cp "native/mj-voice-worker" "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj-worker "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj-worker "$name/mj-worker-aarch64-unknown-linux-musl"
          cp workers/mj-worker-x86_64-apple-darwin/mj-worker "$name/mj-worker-x86_64-apple-darwin"
          cp workers/mj-worker-aarch64-apple-darwin/mj-worker "$name/mj-worker-aarch64-apple-darwin"
          chmod 0755 "$name/mj" "$name/mj-desktop" "$name/mj-voice-worker" "$name"/mj-worker-*
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md release-notices/THIRD_PARTY_LICENSES.html release-notices/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archive-x86_64-unknown-linux-gnu
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  build-linux-arm64:
    name: Build aarch64-unknown-linux-gnu
    needs: verify-version
    # Build natively so desktop and audio system dependencies match the target.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Linux desktop and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev libwebkit2gtk-4.1-dev

      - name: Install pinned Linux CLI toolchain
        run: bash scripts/setup-linux-cli-toolchain.sh

      - name: Build and verify glibc 2.28 CLI
        run: bash scripts/build-linux-cli.sh aarch64-unknown-linux-gnu

      - name: Build desktop and voice worker
        run: cargo build --release --locked -p brokk-mj-desktop -p brokk-mj-voice-worker --target aarch64-unknown-linux-gnu

      - name: Stage native binaries
        run: |
          mkdir native
          cp target/release-cli/aarch64-unknown-linux-gnu/release/mj native/
          cp target/aarch64-unknown-linux-gnu/release/mj-desktop target/aarch64-unknown-linux-gnu/release/mj-voice-worker native/

      - uses: actions/upload-artifact@v7
        with:
          name: native-aarch64-unknown-linux-gnu
          path: native/
          if-no-files-found: error

  package-aarch64-unknown-linux-gnu:
    name: Package aarch64-unknown-linux-gnu
    needs: [build-linux-arm64, build-macos, build-worker-x64, build-worker-arm64, release-notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: native-aarch64-unknown-linux-gnu
          path: native

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*
          path: workers

      - name: Download generated notices
        uses: actions/download-artifact@v8
        with:
          name: release-notices
          path: release-notices

      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu"
          mkdir "$name"
          cp "native/mj" "$name/"
          cp "native/mj-desktop" "$name/"
          cp "native/mj-voice-worker" "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj-worker "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj-worker "$name/mj-worker-aarch64-unknown-linux-musl"
          cp workers/mj-worker-x86_64-apple-darwin/mj-worker "$name/mj-worker-x86_64-apple-darwin"
          cp workers/mj-worker-aarch64-apple-darwin/mj-worker "$name/mj-worker-aarch64-apple-darwin"
          chmod 0755 "$name/mj" "$name/mj-desktop" "$name/mj-voice-worker" "$name"/mj-worker-*
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md release-notices/THIRD_PARTY_LICENSES.html release-notices/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archive-aarch64-unknown-linux-gnu
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS per architecture
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build native binaries
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release --locked -p brokk-mjolnir -p brokk-mj-worker -p brokk-mj-desktop -p brokk-mj-voice-worker --target "$target"
          done

      - name: Stage native binaries
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            mkdir -p "native/$target"
            cp "target/$target/release/mj" "target/$target/release/mj-worker" \
              "target/$target/release/mj-desktop" "target/$target/release/mj-voice-worker" "native/$target/"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: native-x86_64-apple-darwin
          path: native/x86_64-apple-darwin/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: native-aarch64-apple-darwin
          path: native/aarch64-apple-darwin/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mj-worker-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/mj-worker
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mj-worker-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/mj-worker
          if-no-files-found: error

  # The macOS archives keep both Darwin workers: a controller on either Mac
  # architecture can drive a Mac of the other one. Only the npm packages are
  # per-architecture, because the registry rejects the larger tarball.
  package-x86_64-apple-darwin:
    name: Package x86_64-apple-darwin
    needs: [build-macos, build-worker-x64, build-worker-arm64, release-notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-apple-darwin
          path: native

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*
          path: workers

      - name: Download generated notices
        uses: actions/download-artifact@v8
        with:
          name: release-notices
          path: release-notices

      - name: Package archive
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-x86_64-apple-darwin"
          mkdir "$name"
          cp "native/mj" "$name/"
          cp "native/mj-worker" "$name/"
          cp "native/mj-desktop" "$name/"
          cp "native/mj-voice-worker" "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj-worker "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj-worker "$name/mj-worker-aarch64-unknown-linux-musl"
          cp workers/mj-worker-x86_64-apple-darwin/mj-worker "$name/mj-worker-x86_64-apple-darwin"
          cp workers/mj-worker-aarch64-apple-darwin/mj-worker "$name/mj-worker-aarch64-apple-darwin"
          chmod 0755 "$name/mj" "$name/mj-worker" "$name/mj-desktop" "$name/mj-voice-worker" "$name"/mj-worker-*
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md release-notices/THIRD_PARTY_LICENSES.html release-notices/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archive-x86_64-apple-darwin
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  package-aarch64-apple-darwin:
    name: Package aarch64-apple-darwin
    needs: [build-macos, build-worker-x64, build-worker-arm64, release-notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: native-aarch64-apple-darwin
          path: native

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*
          path: workers

      - name: Download generated notices
        uses: actions/download-artifact@v8
        with:
          name: release-notices
          path: release-notices

      - name: Package archive
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          mkdir "$name"
          cp "native/mj" "$name/"
          cp "native/mj-worker" "$name/"
          cp "native/mj-desktop" "$name/"
          cp "native/mj-voice-worker" "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj-worker "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj-worker "$name/mj-worker-aarch64-unknown-linux-musl"
          cp workers/mj-worker-x86_64-apple-darwin/mj-worker "$name/mj-worker-x86_64-apple-darwin"
          cp workers/mj-worker-aarch64-apple-darwin/mj-worker "$name/mj-worker-aarch64-apple-darwin"
          chmod 0755 "$name/mj" "$name/mj-worker" "$name/mj-desktop" "$name/mj-voice-worker" "$name"/mj-worker-*
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md release-notices/THIRD_PARTY_LICENSES.html release-notices/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archive-aarch64-apple-darwin
          path: |
            brokk-mjolnir-*.tar.gz
            brokk-mjolnir-*.tar.gz.sha256
          if-no-files-found: error

  # One x64 Windows controller serves x64 machines natively and Windows on ARM
  # through its x64 emulation. A Windows controller runs container and SSH
  # targets only, so the Linux workers are its only worker payload.
  build-windows:
    name: Build x86_64-pc-windows-msvc
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build controller and desktop
        run: cargo build --release --locked -p brokk-mjolnir -p brokk-mj-desktop --target x86_64-pc-windows-msvc

      - name: Stage native binaries
        shell: bash
        run: |
          mkdir native
          cp target/x86_64-pc-windows-msvc/release/mj.exe target/x86_64-pc-windows-msvc/release/mj-desktop.exe native/
          native/mj.exe --version

      - uses: actions/upload-artifact@v7
        with:
          name: native-x86_64-pc-windows-msvc
          path: native/
          if-no-files-found: error

  package-x86_64-pc-windows-msvc:
    name: Package x86_64-pc-windows-msvc
    needs: [build-windows, build-worker-x64, build-worker-arm64, release-notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-pc-windows-msvc
          path: native

      - name: Download session workers
        uses: actions/download-artifact@v8
        with:
          pattern: mj-worker-*-unknown-linux-musl
          path: workers

      - name: Download generated notices
        uses: actions/download-artifact@v8
        with:
          name: release-notices
          path: release-notices

      # Windows has no execute bit; the controller marks a worker executable
      # when it stages it on the Linux target.
      - name: Package archive
        shell: bash
        run: |
          name="brokk-mjolnir-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc"
          mkdir "$name"
          cp "native/mj.exe" "$name/"
          cp "native/mj-desktop.exe" "$name/"
          cp workers/mj-worker-x86_64-unknown-linux-musl/mj-worker "$name/mj-worker-x86_64-unknown-linux-musl"
          cp workers/mj-worker-aarch64-unknown-linux-musl/mj-worker "$name/mj-worker-aarch64-unknown-linux-musl"
          cp README.md LICENSE "$name/"
          mkdir "$name/licenses"
          cp licenses/SOURCE.md licenses/OFL-1.1.md release-notices/THIRD_PARTY_LICENSES.html release-notices/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "$name/licenses/"
          cp -R licenses/native "$name/licenses/"
          zip -q -r -X "$name.zip" "$name"
          shasum -a 256 "$name.zip" > "$name.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: archive-x86_64-pc-windows-msvc
          path: |
            brokk-mjolnir-*.zip
            brokk-mjolnir-*.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [ci, package-x86_64-unknown-linux-gnu, package-aarch64-unknown-linux-gnu, package-x86_64-apple-darwin, package-aarch64-apple-darwin, package-x86_64-pc-windows-msvc]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # Immutable releases require every asset to be attached while the
          # release is still a draft. Publishing happens in the next step.
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/brokk-mjolnir-*.tar.gz
            artifacts/brokk-mjolnir-*.tar.gz.sha256
            artifacts/brokk-mjolnir-*.zip
            artifacts/brokk-mjolnir-*.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      # Events created with GITHUB_TOKEN do not start workflows, while crates.io
      # rejects trusted-publishing requests from the workflow_run event. An
      # explicit dispatch is both supported by GitHub and trusted by crates.io.
      - name: Dispatch crates.io publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --ref "$GITHUB_REF_NAME" \
            --raw-field release_tag="$GITHUB_REF_NAME" \
            --raw-field publish=true

      - name: Announce release on Discord
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: bash scripts/announce-discord-release.sh
