name: Nightly

# Every night, release master when its CI run is green: bump the minor
# version with cargo-release exactly as RELEASING.md does, push the version
# commit to master with its tag, and start release.yml on the tag. That is a
# normal release: full CI including the macOS and Windows lanes, the GitHub
# release, crates.io, npm and the rest.
#
# A tag pushed with GITHUB_TOKEN does not start workflows, so the tag push
# alone starts nothing; the explicit dispatch runs release.yml once. For the
# same reason the version commit gets no CI run of its own, so a night with no
# new commits on master releases nothing.
#
# A manual dispatch releases nothing: it runs the dispatched branch's macOS
# and Windows lanes.

on:
  schedule:
  - cron: '41 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/macos.yml

  windows:
    name: Windows
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/windows.yml

  release:
    name: Release master if its build is green
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Read master's CI run and dispatch release.yml.
      actions: write
      # Push the version commit and the tag.
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Check master's CI result
      id: green
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        result="$(gh run list --workflow ci.yml --commit "$head" --event push --limit 1 \
          --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')"
        if [[ "$result" == 'completed success' ]]; then
          echo "green=true" >> "$GITHUB_OUTPUT"
        else
          printf 'Not releasing: CI for master %s is "%s".\n' "$head" "${result:-not run}" |
            tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - uses: dtolnay/rust-toolchain@1.99.1
      if: ${{ steps.green.outputs.green == 'true' }}

    - name: Install cargo-release
      if: ${{ steps.green.outputs.green == 'true' }}
      run: cargo install --locked cargo-release --version 1.1.5

    - name: Release
      if: ${{ steps.green.outputs.green == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        cargo release minor --workspace --execute --no-confirm
        version="$(sed -n '/^\[workspace\.package\]$/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
        test -n "$version"
        git tag "v$version"
        # Atomic: if master moved since checkout, neither the commit nor the
        # tag lands, and tomorrow's run releases the newer master.
        git push --atomic origin HEAD:refs/heads/master "refs/tags/v$version"
        gh workflow run release.yml --ref "v$version"
        printf 'Tagged v%s and started release.yml on it.\n' "$version" >> "$GITHUB_STEP_SUMMARY"
