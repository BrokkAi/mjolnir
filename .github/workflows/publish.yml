name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_run:
    workflows: [GitHub Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Mjolnir release tag to package, in the form vX.Y.Z
        required: true
        type: string
      publish:
        description: Publish to crates.io after every packaging check passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Verify and package
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          versions="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "brokk-mjolnir" or .name == "brokk-mj-voice-worker") | [.name, .version] | @tsv')"
          test -n "$versions"
          while IFS=$'\t' read -r crate version; do
            if [ "$tag" != "$version" ]; then
              echo "Tag version ($tag) does not match $crate version ($version)" >&2
              exit 1
            fi
          done <<< "$versions"

      - name: Package crates
        run: |
          cargo package --locked -p brokk-mj-voice-worker
          cargo package --locked -p brokk-mjolnir

      - uses: actions/upload-artifact@v7
        with:
          name: crate-packages-${{ env.RELEASE_TAG }}
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish crates
    needs: package
    if: github.event_name == 'release' || github.event_name == 'workflow_run' || inputs.publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates that are not on the registry yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # crates.io permanently reserves a version number once it is
          # published, and yanking does not release it, so an already-shipped
          # version must be skipped rather than republished. The release and
          # workflow_run triggers both fire for one release; this keeps the
          # overlap from turning the second run red.
          already_published() {
            local crate="$1" path response status body
            case "${#crate}" in
              1) path="1/$crate" ;;
              2) path="2/$crate" ;;
              3) path="3/${crate:0:1}/$crate" ;;
              *) path="${crate:0:2}/${crate:2:2}/$crate" ;;
            esac
            response="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --write-out '\n%{http_code}' "https://index.crates.io/$path")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            case "$status" in
              # A crate with no releases at all is absent from the index.
              404) return 1 ;;
              200)
                jq --exit-status --arg version "$version" \
                  'select(.vers == $version)' >/dev/null <<<"$body"
                ;;
              # Never read a failed lookup as "not published" — errexit does not
              # apply inside a function used as an if condition, so bail out by
              # hand rather than letting an index outage become a publish.
              *)
                echo "crates.io index lookup for $crate failed with HTTP $status" >&2
                exit 1
                ;;
            esac
          }
          for crate in brokk-mj-voice-worker brokk-mjolnir; do
            if already_published "$crate"; then
              echo "$crate $version is already on crates.io, skipping"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
