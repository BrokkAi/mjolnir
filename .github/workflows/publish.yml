name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Mjolnir release tag, in the form vX.Y.Z[-PRERELEASE]
        required: true
        type: string
      publish:
        description: Publish to crates.io after every packaging check passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      # Keep package resolution on the supported GNU/Linux host target.
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Verify release version
        run: |
          cargo metadata --locked --no-deps --format-version 1 |
            jq -e --arg version "${RELEASE_TAG#v}" 'all(.packages[]; .version == $version)'

      - name: Assemble and verify crates
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the known-good commit's validation; package without rebuilding.
          cargo package --locked --workspace --no-verify

          packages="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | [.name, .version] | @tsv')"
          test -n "$packages"
          while IFS=$'\t' read -r crate version; do
            artifact="target/package/$crate-$version.crate"
            if [ ! -f "$artifact" ]; then
              echo "missing packaged crate artifact: $artifact" >&2
              exit 1
            fi
          done <<< "$packages"

      - uses: actions/upload-artifact@v7
        with:
          name: crate-packages-${{ env.RELEASE_TAG }}
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish crates
    needs: package
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      # Compilation was validated on the selected release commit.
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates that are not on the registry yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # crates.io permanently reserves a version number once it is
          # published, and yanking does not release it, so an already-shipped
          # version must be skipped rather than republished. This also makes a
          # retry resume after a partial publish instead of turning red.
          already_published() {
            local crate="$1" path response status body
            case "${#crate}" in
              1) path="1/$crate" ;;
              2) path="2/$crate" ;;
              3) path="3/${crate:0:1}/$crate" ;;
              *) path="${crate:0:2}/${crate:2:2}/$crate" ;;
            esac
            response="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --write-out '\n%{http_code}' "https://index.crates.io/$path")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            case "$status" in
              # A crate with no releases at all is absent from the index.
              404) return 1 ;;
              200)
                jq --exit-status --arg version "$version" \
                  'select(.vers == $version)' >/dev/null <<<"$body"
                ;;
              # Never read a failed lookup as "not published" — errexit does not
              # apply inside a function used as an if condition, so bail out by
              # hand rather than letting an index outage become a publish.
              *)
                echo "crates.io index lookup for $crate failed with HTTP $status" >&2
                exit 1
                ;;
            esac
          }
          # Dependency order: core first, then independent checkpoint,
          # transcript and review implementations, then their runtime/UI consumers.
          # The voice worker is independent. The final binaries come last.
          for crate in brokk-mj-voice-worker brokk-mj-core brokk-mj-review brokk-mj-transcript brokk-mj-checkpoint brokk-mj-client brokk-mj-worker brokk-mj-controller brokk-mj-chat brokk-mj-tui brokk-mj-desktop brokk-mjolnir; do
            if already_published "$crate"; then
              echo "$crate $version is already on crates.io, skipping"
              continue
            fi
            # The sparse index may take a moment to expose a just-published
            # workspace sibling that the next crate needs while packaging.
            for attempt in 1 2 3 4 5 6; do
              cargo publish --locked --no-verify -p "$crate" && break
              test "$attempt" -lt 6 || exit 1
              sleep 10
            done
          done
