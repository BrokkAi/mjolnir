name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Mjolnir release tag to package, in the form vX.Y.Z
        required: true
        type: string
      publish:
        description: Publish to crates.io after every packaging check passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev libwebkit2gtk-4.1-dev

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          # Every workspace member inherits `version.workspace`, so check them
          # all rather than a hand-maintained list that goes stale the next time
          # a crate is extracted.
          versions="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | [.name, .version] | @tsv')"
          test -n "$versions"
          while IFS=$'\t' read -r crate version; do
            if [ "$tag" != "$version" ]; then
              echo "Tag version ($tag) does not match $crate version ($version)" >&2
              exit 1
            fi
          done <<< "$versions"

      - name: Package crates
        run: |
          # Packaging the whole workspace in one run lets cargo resolve the
          # same-release sibling versions (mj-core, mj-agents, mj-tui,
          # mj-remote, mj-desktop) against the crates packaged alongside them
          # instead of against the registry, where this version does not exist
          # until the publish job.
          cargo package --locked --workspace
          # `cargo package` verifies the root without `desktop-app`, so build
          # the feature explicitly to validate that composition too.
          cargo build --locked -p brokk-mjolnir --features desktop-app

      - uses: actions/upload-artifact@v7
        with:
          name: crate-packages-${{ env.RELEASE_TAG }}
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish crates
    needs: package
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev libwebkit2gtk-4.1-dev

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates that are not on the registry yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # crates.io permanently reserves a version number once it is
          # published, and yanking does not release it, so an already-shipped
          # version must be skipped rather than republished. This also makes a
          # retry resume after a partial publish instead of turning red.
          already_published() {
            local crate="$1" path response status body
            case "${#crate}" in
              1) path="1/$crate" ;;
              2) path="2/$crate" ;;
              3) path="3/${crate:0:1}/$crate" ;;
              *) path="${crate:0:2}/${crate:2:2}/$crate" ;;
            esac
            response="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --write-out '\n%{http_code}' "https://index.crates.io/$path")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            case "$status" in
              # A crate with no releases at all is absent from the index.
              404) return 1 ;;
              200)
                jq --exit-status --arg version "$version" \
                  'select(.vers == $version)' >/dev/null <<<"$body"
                ;;
              # Never read a failed lookup as "not published" — errexit does not
              # apply inside a function used as an if condition, so bail out by
              # hand rather than letting an index outage become a publish.
              *)
                echo "crates.io index lookup for $crate failed with HTTP $status" >&2
                exit 1
                ;;
            esac
          }
          # Dependency order: mj-core has no workspace dependencies, mj-agents
          # needs it, mj-tui needs both, mj-remote needs mj-core, and the root
          # binary needs all of them plus mj-desktop. brokk-mj-voice-worker is
          # independent. Publishing out of this order fails on a missing
          # registry dependency.
          for crate in brokk-mj-voice-worker mj-core mj-agents mj-tui mj-remote mj-desktop brokk-mjolnir; do
            if already_published "$crate"; then
              echo "$crate $version is already on crates.io, skipping"
              continue
            fi
            # The sparse index may take a moment to expose a just-published
            # workspace sibling that the next crate needs while packaging.
            for attempt in 1 2 3 4 5 6; do
              cargo publish --locked -p "$crate" && break
              test "$attempt" -lt 6 || exit 1
              sleep 10
            done
          done
