name: Coverage

on:
  pull_request: {}
  push:
    branches: [ 'master' ]
  workflow_dispatch: {}
  # Tag builds reach this through release.yml rather than a tag trigger, so the
  # release can depend on the result instead of racing it.
  workflow_call: {}

permissions:
  contents: read

jobs:
  llvm-coverage:
    name: LLVM coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      id: toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: llvm-tools-preview
        targets: x86_64-unknown-linux-musl

    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    # Deliberately excludes `target/llvm-cov-target`: a restored cache brings
    # back stale `.profraw` profiles and instrumented binaries from an earlier
    # commit, which silently mixes into the reported percentage that
    # `scripts/check-coverage.mjs` gates on.
    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: coverage-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          coverage-cargo-${{ steps.toolchain.outputs.cachekey }}-
          coverage-cargo-

    - name: Install pinned coverage tool
      run: cargo install --locked cargo-llvm-cov --version 0.8.7

    - name: Collect Mjolnir coverage
      run: |
        cargo llvm-cov --workspace --exclude brokk-mj-voice-worker --exclude brokk-mj-desktop --no-report --locked
        cargo llvm-cov report -p brokk-mj-core -p brokk-mj-tui -p brokk-mjolnir --lcov --output-path coverage.lcov
        cargo llvm-cov report -p brokk-mj-core -p brokk-mj-tui -p brokk-mjolnir --json --output-path coverage.json

    - name: Check coverage baseline
      run: node scripts/check-coverage.mjs coverage.json .github/coverage-baseline.json coverage-summary.md

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: llvm-coverage
        path: |
          coverage.json
          coverage.lcov
          coverage-summary.md
        if-no-files-found: warn
        retention-days: 30
