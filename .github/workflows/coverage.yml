name: Coverage

on:
  push:
    branches: [ 'master', 'ci/**' ]
  pull_request: {}
  # Tag builds reach this through release.yml rather than a tag trigger, so the
  # release can depend on the result instead of racing it.
  workflow_call: {}

permissions:
  contents: read

jobs:
  llvm-coverage:
    name: LLVM coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      id: toolchain
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        components: llvm-tools-preview

    - name: Install Linux audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

    - name: Cache cargo registry and coverage build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/llvm-cov-target
        key: coverage-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          coverage-cargo-${{ steps.toolchain.outputs.cachekey }}-
          coverage-cargo-

    - name: Install pinned coverage tool
      run: cargo install --locked cargo-llvm-cov --version 0.8.7

    - name: Collect workspace coverage
      run: |
        cargo llvm-cov --workspace --exclude mj-desktop --exclude-from-report brokk-mj-voice-worker --no-report --locked
        cargo llvm-cov --workspace --exclude mj-desktop --exclude-from-report brokk-mj-voice-worker --no-run --locked --lcov --output-path coverage.lcov
        cargo llvm-cov --workspace --exclude mj-desktop --exclude-from-report brokk-mj-voice-worker --no-run --locked --json --output-path coverage.json

    - name: Check coverage baseline
      run: node scripts/check-coverage.mjs coverage.json .github/coverage-baseline.json coverage-summary.md

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: llvm-coverage
        path: |
          coverage.json
          coverage.lcov
          coverage-summary.md
        if-no-files-found: warn
        retention-days: 30
