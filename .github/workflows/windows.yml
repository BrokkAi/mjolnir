name: Windows

# The one Windows job definition. ci.yml calls it on every release tag, and
# nightly.yml calls it every night and on manual dispatch. Check-ins do not
# run it. Do not add
# workflow-level concurrency here: in a called workflow, github.workflow is the
# caller's name, so the group would collide with the caller's own.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      # The suites that pass on Windows include the worker MCP tests, the
      # daemon startup tests that run `mj` against isolated instances, and the
      # ConPTY smoke that renders the dashboard. MicroVM and worker review
      # compile on Windows with their platform-specific tests gated out.
      # mj-controller, mj-server and mj-daemon tests that still fail on Windows
      # are ignored there with
      # `cfg_attr(windows, ignore = "#<issue>: ...")`; the sub-issues of #1261
      # remove those attributes as they are fixed.
      #
      # One list for the compile step and the run step. A different selection
      # of packages resolves different Cargo features, and the run step then
      # compiles everything again: 7.9 minutes on 2026-11-19, when the compile
      # step built the whole workspace and the run step built this list.
      TEST_PACKAGES: >-
        -p brokk-mj-core -p brokk-mj-harness-install -p brokk-mj-chat -p brokk-mj-tui -p brokk-mj-client -p brokk-mj-review -p brokk-mj-microvm -p brokk-mj-worker-mcp -p brokk-mj-worker-review -p brokk-mj-transcript -p brokk-mjolnir -p brokk-mj-targets -p brokk-mj-store -p brokk-mj-accounts -p brokk-mj-import -p brokk-mj-sessionwiki -p brokk-mj-build-cache -p brokk-mj-worker-staging -p brokk-mj-worker-launch -p brokk-mj-session-runtime -p brokk-mj-review-host -p brokk-mj-profile-catalog -p brokk-mj-github-relevance -p brokk-mj-github-watch -p brokk-mj-controller -p brokk-mj-setup -p brokk-mj-server -p brokk-mj-daemon
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: clippy
        targets: x86_64-pc-windows-msvc

    - uses: ./.github/actions/cache-rust
      with:
        lane: cli-tests-x86_64-pc-windows-msvc
        build-paths: |
          target/debug
          target/release
          target/x86_64-pc-windows-msvc/debug
          target/x86_64-pc-windows-msvc/release

    - name: Run Clippy lints
      run: cargo clippy --all-targets --features brokk-mjolnir/test-hooks -- -D warnings

    # Clippy above checks every test target; this compiles and links the ones
    # that run here.
    - name: Compile tests
      run: cargo test --no-run $env:TEST_PACKAGES.Split(' ') --features brokk-mjolnir/test-hooks

    # `--no-fail-fast` reports every failing crate: one failure used to hide
    # the crates after it.
    - name: Run tests
      run: cargo test --no-fail-fast $env:TEST_PACKAGES.Split(' ') --features brokk-mjolnir/test-hooks

    - name: Test the Windows installer
      run: node --test scripts/install-ps1.test.mjs
