name: CI

on:
  push:
    branches: [ 'master', 'ci/**' ]
  pull_request: {}

jobs:
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Check workspace release versions
      run: node scripts/release-version.mjs check

    - name: Install pinned license tools
      run: |
        cargo install --locked cargo-about --version 0.9.1 --features cli
        cargo install --locked cargo-deny --version 0.20.2

    - name: Fetch locked dependencies
      run: cargo fetch --locked

    - name: Check dependency license policy
      run: cargo deny --workspace --config licenses/deny.toml --locked check licenses

    - name: Check shipped notice reports
      run: |
        cargo about generate --workspace --offline --config licenses/about.toml --locked --fail licenses/about.hbs -o /tmp/THIRD_PARTY_LICENSES.html
        diff -u licenses/THIRD_PARTY_LICENSES.html /tmp/THIRD_PARTY_LICENSES.html
        node scripts/generate-supplemental-third-party-notices.mjs /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt
        diff -u licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt

    - name: Check crate package contents and build
      run: |
        diff -u LICENSE voice-worker/LICENSE
        cargo package --locked --allow-dirty --list -p brokk-mj-core > /tmp/hel-package-files.txt
        cargo package --locked --allow-dirty --list -p brokk-mj-voice-worker > /tmp/voice-worker-package-files.txt
        grep -Fx LICENSE /tmp/hel-package-files.txt
        grep -Fx licenses/THIRD_PARTY_LICENSES.html /tmp/hel-package-files.txt
        grep -Fx licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt /tmp/hel-package-files.txt
        grep -Fx LICENSE /tmp/voice-worker-package-files.txt
        diff -u LICENSE mj-tui/LICENSE
        diff -u LICENSE mj-cli/LICENSE
        diff -u LICENSE mj-desktop/LICENSE
        cargo package --locked --allow-dirty --list -p brokk-mj-tui > /tmp/hel-tui-package-files.txt
        cargo package --locked --allow-dirty --list -p brokk-mjolnir > /tmp/hel-cli-package-files.txt
        cargo package --locked --allow-dirty --list -p brokk-mj-desktop > /tmp/mj-desktop-package-files.txt
        grep -Fx LICENSE /tmp/hel-tui-package-files.txt
        grep -Fx LICENSE /tmp/hel-cli-package-files.txt
        grep -Fx LICENSE /tmp/mj-desktop-package-files.txt
        cargo package --locked -p brokk-mj-core

  mjolnir:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      id: toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: rustfmt, clippy
        targets: ${{ matrix.target }}

    - name: Install Linux musl tools
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    - name: Cache cargo registry and build
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-hel-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-hel-cargo-${{ steps.toolchain.outputs.cachekey }}-
          ${{ runner.os }}-hel-cargo-

    - name: Check Rust formatting
      run: cargo fmt --check

    - name: Run Clippy lints
      run: cargo clippy --all-targets -- -D warnings

    - name: Run desktop Clippy lints
      if: runner.os != 'Linux'
      run: cargo clippy --locked -p brokk-mj-desktop --all-targets -- -D warnings

    - name: Build Hel
      run: cargo build --release

    - name: Build desktop application
      if: runner.os != 'Linux'
      run: cargo build --release --locked -p brokk-mj-desktop

    # The runtime suite exercises Unix target paths, directory fsync, and Git
    # worktree byte preservation. Clippy above still compiles every test target
    # on Windows, while Linux and macOS execute the suite.
    - name: Run tests
      if: runner.os != 'Windows'
      run: cargo test

    - name: Run desktop tests
      if: runner.os == 'macOS'
      run: cargo test --locked -p brokk-mj-desktop

    - name: Compile tests on Windows
      if: runner.os == 'Windows'
      run: cargo test --no-run

    - name: Compile desktop tests on Windows
      if: runner.os == 'Windows'
      run: cargo test --locked -p brokk-mj-desktop --no-run

  reliability-smoke:
    name: Three-client reliability smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    - name: Build the isolated-test controller
      run: cargo build --locked -p brokk-mjolnir

    - name: Run deterministic daemon, two-TUI, and web scenario
      run: tests/e2e/run-reliability.sh --scenario multi-client-happy-path --seed 1 ./target/x86_64-unknown-linux-musl/debug/mj

    - name: Upload reliability evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-reliability-smoke
        path: target/reliability-artifacts/
        if-no-files-found: warn
        retention-days: 14

  desktop-linux:
    # The primary Linux jobs build the headless `mj` for musl. This is the
    # pull-request compile-and-test gate for the separate GNU/Linux desktop
    # executable that releases ship beside it.
    name: Desktop shell (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy
        targets: x86_64-unknown-linux-gnu

    - name: Install Linux desktop dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libwebkit2gtk-4.1-dev

    - name: Clippy over the controller and desktop paths
      run: cargo clippy --locked -p brokk-mjolnir -p brokk-mj-desktop --all-targets -- -D warnings

    - name: Build the desktop crate
      run: cargo check --locked -p brokk-mj-desktop

    - name: Test the headless mj binary
      run: cargo test --locked -p brokk-mjolnir --bin mj

    - name: Test the desktop package
      run: cargo test --locked -p brokk-mj-desktop

  voice-worker:
    name: Voice worker (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/.ci-cache/sherpa-onnx
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy

    - name: Install Linux audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

    - name: Cache sherpa-onnx native archive
      uses: actions/cache@v5
      with:
        path: .ci-cache/sherpa-onnx
        key: sherpa-onnx-v1.13.3-linux-x64-static

    - name: Fetch sherpa-onnx native archive
      shell: bash
      run: |
        archive='sherpa-onnx-v1.13.3-linux-x64-static-lib.tar.bz2'
        mkdir -p "$SHERPA_ONNX_ARCHIVE_DIR"
        destination="$SHERPA_ONNX_ARCHIVE_DIR/$archive"
        if [[ ! -f "$destination" ]] || ! tar -tjf "$destination" >/dev/null; then
          rm -f "$destination" "$destination.part"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$destination.part" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/$archive"
          tar -tjf "$destination.part" >/dev/null
          mv "$destination.part" "$destination"
        fi

    - name: Check voice worker
      run: cargo clippy -p brokk-mj-voice-worker --all-targets -- -D warnings

    - name: Test voice worker
      run: cargo test -p brokk-mj-voice-worker
