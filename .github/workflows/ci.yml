name: CI

on:
  push:
    branches: [ 'master', 'ci/**' ]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  unused-dependencies:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@1.96.0
    - name: Cache pinned cargo-machete
      id: machete-tool
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cargo-machete
        key: cargo-machete-${{ runner.os }}-${{ runner.arch }}-0.9.2-rust-1.96.0
    - name: Install pinned cargo-machete
      if: steps.machete-tool.outputs.cache-hit != 'true'
      run: cargo install --locked cargo-machete --version 0.9.2
    - run: cargo machete

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
    - uses: actions/checkout@v6

    - name: Test RunsOn launch-template helper
      run: bash scripts/test-update-runson-launch-template.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Test release archive assembly and parallel npm publishing
      run: node --test scripts/release-workflow.test.mjs

    - uses: ./.github/actions/cache-rust
      with:
        lane: licenses-musl
        build-paths: target/package

    - name: Cache pinned license tool
      id: license-tool
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cargo-deny
        key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-0.20.2-rust-1.96.0

    - name: Install pinned license tools
      if: steps.license-tool.outputs.cache-hit != 'true'
      run: |
        cargo install --locked cargo-deny --version 0.20.2

    - name: Fetch locked dependencies
      run: cargo fetch --locked

    - name: Check dependency license policy
      run: cargo deny --workspace --config licenses/deny.toml --locked check licenses

    - name: Check crate ownership and packaged assets
      run: |
        node scripts/check-crate-boundaries.mjs

    - name: Check crate package contents and build
      run: |
        set -euo pipefail
        # Each crate has a LICENSE symlink to the root file; cargo package
        # dereferences it into the archive.
        # Assemble the file list for each published crate and confirm the
        # licence text ships with it. `--list` does not build, so a crate whose
        # path dependencies are not on the registry yet still works here.
        for package in brokk-mj-core brokk-mj-review brokk-mj-transcript brokk-mj-checkpoint brokk-mj-voice-worker brokk-mj-worker \
          brokk-mj-client brokk-mj-controller brokk-mj-chat brokk-mj-tui brokk-mjolnir \
          brokk-mj-desktop; do
          cargo package --locked --allow-dirty --list -p "$package" > "/tmp/$package-package-files.txt"
          grep -Fx LICENSE "/tmp/$package-package-files.txt"
        done
        # Only the foundation can be verified by extraction before a release:
        # every other crate depends on an unpublished path dependency.
        cargo package --locked -p brokk-mj-core

  mjolnir:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}

    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy
        targets: ${{ matrix.target }}

    - uses: ./.github/actions/cache-rust
      with:
        lane: cli-tests-${{ matrix.target }}
        build-paths: |
          target/debug
          target/${{ matrix.target }}/debug

    - name: Run Clippy lints
      run: cargo clippy --all-targets -- -D warnings

    # The runtime suite exercises Unix target paths, directory fsync, and Git
    # worktree byte preservation. Clippy above still compiles every test target
    # on Windows, while Linux and macOS execute the suite.
    - name: Run tests
      if: runner.os != 'Windows'
      run: cargo test

    - name: Compile tests on Windows
      if: runner.os == 'Windows'
      run: cargo test --no-run

  cli-release:
    name: CLI release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@1.96.0
      with:
        targets: ${{ matrix.target }}
    - uses: ./.github/actions/cache-rust
      with:
        lane: cli-release-${{ matrix.target }}
        build-paths: |
          target/release
          target/${{ matrix.target }}/release
    - name: Build Mjolnir
      run: cargo build --release

  portable-worker:
    name: Portable worker (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy
        targets: x86_64-unknown-linux-musl
    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools
    - uses: ./.github/actions/cache-rust
      with:
        lane: portable-worker-musl
        build-paths: target/worker
    - name: Check portable worker boundary
      run: cargo clippy --target-dir target/worker --target x86_64-unknown-linux-musl -p brokk-mj-worker --bin mj-worker -- -D warnings
    - name: Build portable worker
      run: cargo build --release --target-dir target/worker --target x86_64-unknown-linux-musl -p brokk-mj-worker --bin mj-worker

  desktop-native:
    name: Desktop shell (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy
        targets: ${{ matrix.target }}
    - uses: ./.github/actions/cache-rust
      with:
        lane: desktop-${{ matrix.target }}
        build-paths: |
          target/debug
          target/release
          target/${{ matrix.target }}
    - name: Run desktop Clippy lints
      run: cargo clippy --locked -p brokk-mj-desktop --all-targets -- -D warnings
    - name: Build desktop application
      run: cargo build --release --locked -p brokk-mj-desktop
    - name: Run desktop tests
      if: runner.os == 'macOS'
      run: cargo test --locked -p brokk-mj-desktop
    - name: Compile desktop tests on Windows
      if: runner.os == 'Windows'
      run: cargo test --locked -p brokk-mj-desktop --no-run

  reliability-smoke:
    name: Three-client reliability smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    - uses: ./.github/actions/cache-rust
      with:
        lane: reliability-smoke
        build-paths: |
          target/debug
          target/worker

    - name: Build the isolated-test controller and portable worker
      run: |
        cargo build --locked -p brokk-mjolnir
        cargo build --locked --target-dir target/worker --target x86_64-unknown-linux-musl -p brokk-mj-worker --bin mj-worker

    - name: Run deterministic daemon, two-TUI, and web scenario
      run: tests/e2e/run-reliability.sh --scenario multi-client-happy-path --seed 1 ./target/debug/mj

    - name: Upload reliability evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-reliability-smoke
        path: target/reliability-artifacts/
        if-no-files-found: warn
        retention-days: 14

  desktop-linux:
    # The primary Linux job builds the headless `mj` natively. This is the
    # pull-request compile-and-test gate for the separate GNU/Linux desktop
    # executable that releases ship beside it.
    name: Desktop shell (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy
        targets: x86_64-unknown-linux-gnu

    - name: Install Linux desktop dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libwebkit2gtk-4.1-dev

    - uses: ./.github/actions/cache-rust
      with:
        lane: desktop-x86_64-unknown-linux-gnu
        build-paths: |
          target/debug
          target/x86_64-unknown-linux-gnu/debug

    - name: Clippy over the controller and desktop paths
      run: cargo clippy --locked -p brokk-mjolnir -p brokk-mj-desktop --all-targets -- -D warnings

    - name: Build the desktop crate
      run: cargo check --locked -p brokk-mj-desktop

    - name: Test the headless mj binary
      run: cargo test --locked -p brokk-mjolnir --bin mj

    - name: Test the desktop package
      run: cargo test --locked -p brokk-mj-desktop

  voice-worker:
    name: Voice worker (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy

    - name: Install Linux audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

    - uses: ./.github/actions/cache-rust
      with:
        lane: voice-x86_64-unknown-linux-gnu
        build-paths: |
          target/debug
          target/x86_64-unknown-linux-gnu/debug

    - name: Check voice worker
      run: cargo clippy -p brokk-mj-voice-worker --all-targets -- -D warnings

    - name: Test voice worker
      run: cargo test -p brokk-mj-voice-worker

  linux-cli-compatibility:
    name: Linux CLI glibc 2.28 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test installer and ELF verification
        run: node --test scripts/linux-release.test.mjs
      - name: Install pinned Linux CLI toolchain
        run: bash scripts/setup-linux-cli-toolchain.sh
      - uses: ./.github/actions/cache-rust
        with:
          lane: compatibility-${{ matrix.target }}
          build-paths: target/release-cli
      - name: Build and verify glibc 2.28 CLI
        run: bash scripts/build-linux-cli.sh ${{ matrix.target }}
      - name: Test CLI on older Linux distributions through tmux
        run: bash scripts/test-linux-cli-runtime.sh ${{ matrix.target }}

  web-viewer:
    name: Web viewer unit and deterministic browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/web/package-lock.json
      - name: Install dependencies and Chromium
        run: |
          npm ci --prefix tests/e2e/web
          npx --prefix tests/e2e/web playwright install --with-deps chromium
      # No MJ_BROWSER_* variables here: this selection must pass without the
      # provisioned lab, which .github/workflows/reliability.yml still runs.
      - name: Run unit and self-contained browser tests
        working-directory: tests/e2e/web
        run: npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-viewer-deterministic
          path: tests/e2e/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
