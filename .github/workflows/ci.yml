name: CI

on:
  push:
    branches: [ 'master', 'ci/**' ]
  pull_request: {}
  # release.yml runs the whole suite on the tagged commit before publishing.
  workflow_call: {}

# Jobs build and run pull-request code (build scripts, tests); none writes to
# the repository, so the token is read-only and checkouts keep no credentials.
permissions:
  contents: read

# A pull request keeps only the run for its newest commit. Every pushed commit
# gets its own group and runs to completion: master receives pushes more often
# than a run takes, so cancelling superseded runs left no commit with a result,
# and nightly.yml releases only a commit whose push run succeeded. The group
# must name the commit, because a shared group also cancels its pending runs.
# In a call from release.yml, github.workflow is the caller's name, so a
# release never shares a group with branch CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  unused-dependencies:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@1.99.1
    - name: Cache pinned cargo-machete
      id: machete-tool
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cargo-machete
        key: cargo-machete-${{ runner.os }}-${{ runner.arch }}-0.9.2-rust-1.99.1
    - name: Install pinned cargo-machete
      if: steps.machete-tool.outputs.cache-hit != 'true'
      run: cargo install --locked cargo-machete --version 0.9.2
    - run: cargo machete

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Test RunsOn launch-template helper
      run: bash scripts/test-update-runson-launch-template.sh

    - name: Test the nightly tracking-issue script
      run: bash scripts/test-nightly-issue.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Test release archive assembly and parallel npm publishing
      run: node --test scripts/release-workflow.test.mjs

    - name: Test agent-dev image build invariants
      run: node --test scripts/agent-dev-image.test.mjs

    - uses: ./.github/actions/cache-rust
      with:
        lane: licenses-musl
        build-paths: target/package

    - name: Cache pinned license tool
      id: license-tool
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cargo-deny
        key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-0.20.2-rust-1.99.1

    - name: Install pinned license tools
      if: steps.license-tool.outputs.cache-hit != 'true'
      run: |
        cargo install --locked cargo-deny --version 0.20.2

    - name: Fetch locked dependencies
      run: cargo fetch --locked

    - name: Check dependency license policy
      run: cargo deny --workspace --config licenses/deny.toml --locked check licenses

    - name: Check crate ownership and packaged assets
      run: |
        node scripts/check-crate-boundaries.mjs

    # mj-controller is being split into layered crates
    # (.agents/plans/split-mj-controller-by-layer.md). This keeps the layers
    # that are already separated from growing back together.
    - name: Check mj-controller layer boundaries
      run: python3 scripts/check-controller-layers.py

    - name: Check crate package contents and build
      run: |
        set -euo pipefail
        # Each crate has a LICENSE symlink to the root file; cargo package
        # dereferences it into the archive.
        # Assemble the file list for each published crate and confirm the
        # licence text ships with it. `--list` does not build, so a crate whose
        # path dependencies are not on the registry yet still works here.
        for package in brokk-mj-core brokk-mj-review brokk-mj-transcript brokk-mj-checkpoint brokk-mj-voice-worker brokk-mj-worker \
          brokk-mj-client brokk-mj-controller brokk-mj-chat brokk-mj-tui brokk-mjolnir; do
          cargo package --locked --allow-dirty --list -p "$package" > "/tmp/$package-package-files.txt"
          grep -Fx LICENSE "/tmp/$package-package-files.txt"
        done
        # Only the foundation can be verified by extraction before a release:
        # every other crate depends on an unpublished path dependency.
        cargo package --locked -p brokk-mj-core

  # Clippy and the tests are separate jobs: neither reuses the other's build
  # output, so running them in sequence only added clippy's time to the wait.
  clippy:
    name: Clippy (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: clippy
        targets: x86_64-unknown-linux-gnu

    - uses: ./.github/actions/cache-rust-dependencies
      with:
        lane: clippy

    - name: Run Clippy lints
      run: cargo clippy --all-targets -- -D warnings

  # The workspace tests, split so that no runner compiles everything. Building
  # is most of the wait, and mj-controller's test build is most of the
  # building: one compiler process, largely single-threaded. Measured cold on
  # four threads: 717s for the whole workspace in one job; 468s, 471s and 270s
  # for the shards below.
  #
  # Together the shards run exactly what `cargo test` runs at the workspace
  # root. `libraries` takes every member the other two do not name, so a new
  # crate is tested without an edit here. Cargo resolves features for the
  # selected packages only, so a shard must enable any feature its tests need
  # and another shard's crate used to turn on: see `libraries`.
  #
  # The runtime suite exercises Unix target paths, directory fsync, and Git
  # worktree byte preservation. Linux executes the suite here and
  # .github/workflows/macos.yml runs it on macOS; .github/workflows/windows.yml
  # runs the controller-side suites on Windows.
  tests:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        include:
        # mj-controller's tests take 8 to 9 minutes to run on one runner, after
        # a 6 minute build, so three runners each build the crate and run a
        # part of them. `select` names the part: see "Run tests".
        - name: controller, controller modules
          lane: tests-controller
          tests: -p brokk-mj-controller
          select: first
        - name: controller, daemon and server modules
          lane: tests-controller
          tests: -p brokk-mj-controller
          select: second
        - name: controller, other modules
          lane: tests-controller
          tests: -p brokk-mj-controller
          select: rest
        - name: worker-cli
          lane: tests-worker-cli
          tests: -p brokk-mj-worker -p brokk-mjolnir
        # mj-core has tests behind `test-hooks`, which only the crates in the
        # other shards enable.
        - name: libraries
          lane: tests-libraries
          tests: >-
            --workspace --exclude brokk-mj-controller --exclude brokk-mj-worker
            --exclude brokk-mjolnir --exclude brokk-mj-voice-worker
            --features brokk-mj-core/test-hooks

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: x86_64-unknown-linux-gnu

    - uses: ./.github/actions/cache-rust-dependencies
      with:
        lane: ${{ matrix.lane }}

    # A separate step, so the log shows how the wait divides between building
    # and running.
    - name: Build tests
      run: cargo test --no-run ${{ matrix.tests }}

    # `--no-fail-fast` reports every failing test binary: one failure used to
    # hide the binaries after it.
    #
    # A shard with `select` runs the tests whose path contains one of its
    # names. `rest` skips exactly the names the other parts select, so every
    # test runs in some part, and a test in a new module runs in `rest`.
    - name: Run tests
      env:
        SELECT: ${{ matrix.select }}
      run: |
        first='controller::'
        second='daemon:: server'
        case "$SELECT" in
          '') set -- ;;
          first) set -- $first ;;
          second) set -- $second ;;
          rest) set --; for name in $first $second; do set -- "$@" --skip "$name"; done ;;
          *) echo "unknown test selection: $SELECT" >&2; exit 2 ;;
        esac
        cargo test --no-fail-fast ${{ matrix.tests }} -- "$@"

  # Check-ins run Linux only. macOS and Windows run nightly in nightly.yml,
  # and here only when release.yml calls this workflow for a tag, so a release
  # still publishes only after every platform lane passes.
  macos:
    name: macOS
    if: ${{ github.ref_type == 'tag' }}
    uses: ./.github/workflows/macos.yml

  windows:
    name: Windows
    if: ${{ github.ref_type == 'tag' }}
    uses: ./.github/workflows/windows.yml

  portable-worker:
    name: Portable worker (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: clippy
        targets: x86_64-unknown-linux-musl
    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools
    - uses: ./.github/actions/cache-rust
      with:
        lane: portable-worker-musl
        build-paths: target/worker
    - name: Check portable worker boundary
      run: cargo clippy --target-dir target/worker --target x86_64-unknown-linux-musl -p brokk-mj-worker --bin mj-worker -- -D warnings
    - name: Build portable worker
      run: cargo build --target-dir target/worker --target x86_64-unknown-linux-musl -p brokk-mj-worker --bin mj-worker

  reliability-smoke:
    name: Three-client reliability smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        targets: x86_64-unknown-linux-musl

    - name: Install Linux musl tools
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes musl-tools

    - uses: ./.github/actions/cache-rust
      with:
        lane: reliability-smoke
        build-paths: |
          target/debug
          target/worker

    - name: Build the isolated-test controller and portable worker
      run: |
        cargo build --locked -p brokk-mjolnir
        cargo build --locked --target-dir target/worker --target x86_64-unknown-linux-musl -p brokk-mj-worker --bin mj-worker

    - name: Run deterministic daemon, two-TUI, and web scenario
      run: tests/e2e/run-reliability.sh --scenario multi-client-happy-path --seed 1 ./target/debug/mj

    - name: Upload reliability evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-reliability-smoke
        path: target/reliability-artifacts/
        if-no-files-found: warn
        retention-days: 14

  voice-worker:
    name: Voice worker (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: clippy

    - name: Install Linux audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --assume-yes libasound2-dev

    - uses: ./.github/actions/cache-rust
      with:
        lane: voice-x86_64-unknown-linux-gnu
        build-paths: |
          target/debug
          target/x86_64-unknown-linux-gnu/debug

    - name: Check voice worker
      run: cargo clippy -p brokk-mj-voice-worker --all-targets -- -D warnings

    - name: Test voice worker
      run: cargo test -p brokk-mj-voice-worker

  linux-cli-compatibility:
    name: Linux CLI glibc 2.28 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test installer and ELF verification
        run: node --test scripts/linux-release.test.mjs
      - name: Install pinned Linux CLI toolchain
        run: bash scripts/setup-linux-cli-toolchain.sh
      - uses: ./.github/actions/cache-rust
        with:
          lane: compatibility-${{ matrix.target }}
          build-paths: target/release-cli
      # The glibc floor and ELF checks do not depend on optimization, so CI
      # builds the dev profile; release.yml builds the shipped release binary.
      - name: Build and verify glibc 2.28 CLI
        env:
          MJ_CLI_PROFILE: dev
        run: bash scripts/build-linux-cli.sh ${{ matrix.target }}
      - name: Test CLI on older Linux distributions through tmux
        env:
          MJ_CLI_PROFILE: dev
        run: bash scripts/test-linux-cli-runtime.sh ${{ matrix.target }}

  web-viewer:
    name: Web viewer unit and deterministic browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/web/package-lock.json
      - name: Install dependencies and Chromium
        run: |
          npm ci --prefix tests/e2e/web
          npx --prefix tests/e2e/web playwright install --with-deps chromium
      # No MJ_BROWSER_* variables here: this selection must pass without the
      # provisioned lab, which .github/workflows/reliability.yml still runs.
      - name: Run unit and self-contained browser tests
        working-directory: tests/e2e/web
        run: npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-viewer-deterministic
          path: tests/e2e/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
