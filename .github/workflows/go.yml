name: Go

# The Go implementation of Mjolnir (go/README.md) is built beside the Rust
# one. This lane runs only when the Go tree changes, on Linux, and never
# gates a Rust change: Rust sources move independently, and
# `python3 go/port/status.py --drift` tracks what the Go side has to catch up.
on:
  push:
    branches: [ 'master', 'ci/**' ]
    paths:
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - 'assets.go'
      - 'scripts/go/**'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'go.mod'
      - 'go.sum'
      - 'assets.go'
      - 'scripts/go/**'
      - '.github/workflows/go.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: '0'

jobs:
  check:
    name: Format, vet and cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l assets.go go)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Check the embedded asset list against the Rust sources
      run: python3 go/port/gen_assets.py --check

    - name: Vet
      run: go vet -tags 'mj_debug mj_test_support mj_test_hooks mj_test_identity mj_golden mj_github_history' ./go/...

    # Pure Go cross-compiles from one machine, so every platform the Rust
    # build supports is compiled here without a macOS or Windows runner.
    - name: Build for every platform
      run: |
        set -euo pipefail
        for os in linux darwin windows; do
          for arch in amd64 arm64; do
            echo "::group::$os/$arch"
            GOOS=$os GOARCH=$arch go build ./go/...
            GOOS=$os GOARCH=$arch go vet ./go/... 
            echo "::endgroup::"
          done
        done

  test:
    name: Tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # The tests replay Rust's recorded answers (testdata/oracle), so this job
    # needs no Rust toolchain. `MJ_ORACLE=live` compares against the real
    # crates and runs in the oracle job below.
    - name: Run tests
      run: go/port/gotest.sh ./go/...

  # Compares the runtime packages with the real Rust crates. It builds one
  # oracle program for each package, so it runs on demand and not per push.
  oracle:
    name: Live comparison with Rust
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - uses: dtolnay/rust-toolchain@1.99.1

    - name: Compare with Rust
      env:
        MJ_ORACLE: live
      run: go/port/gotest.sh ./go/rs/... ./go/crates/...
