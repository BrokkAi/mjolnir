name: Publish agent-dev image

on:
  push:
    branches: [ 'master' ]
    paths:
      - 'containers/**'
      - '.github/workflows/publish-agent-dev-image.yml'
  workflow_dispatch: {}
  # Rebuild weekly so the image picks up new base layers and apt security
  # updates even when containers/ has not changed.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      # GHCR rejects uppercase paths, and the owner is mixed case on the
      # upstream repository, so lowercase it here instead of hardcoding it.
      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/mjolnir/agent-dev" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each runner is native for its own platform, so no QEMU emulation is
      # involved. Buildx passes TARGETARCH to the build automatically.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers
          file: containers/Containerfile.agent-dev
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: false
          labels: |
            org.opencontainers.image.title=Mjolnir agent development environment
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Mjolnir agent development environment with Node, Rust, cargo-nextest, OpenJDK, and the pinned ACP bridges
            org.opencontainers.image.licenses=GPL-3.0-only
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/mjolnir/agent-dev" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The per-arch jobs pushed untagged manifests. This joins them into one
      # multi-arch tag that resolves to the right image on each host.
      - name: Create multi-arch manifest
        shell: bash
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${GITHUB_SHA:0:7}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect published image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker buildx imagetools inspect "$IMAGE:latest"
