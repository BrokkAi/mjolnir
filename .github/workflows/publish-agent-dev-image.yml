name: Publish agent-dev image

on:
  push:
    branches: [ 'master' ]
    paths:
      - 'containers/**'
      - '.dockerignore'
      - 'mj-worker/assets/muse/**'
      - 'scripts/install-muse.py'
      - '.github/workflows/publish-agent-dev-image.yml'
  workflow_dispatch: {}
  # Called by release.yml so a tagged release publishes agent-dev:<version>
  # from the same workflow that publishes :latest from master. The push,
  # schedule and dispatch triggers use these defaults and keep publishing the
  # floating :latest tag.
  workflow_call:
    inputs:
      extra_tags:
        description: >-
          Space-separated extra tags for the published manifest list, such as
          "2.37.0" for a release.
        type: string
        default: ''
      # A string rather than a boolean so the push, schedule and dispatch
      # triggers, which have no inputs context, still fall back to :latest.
      publish_latest:
        description: Whether to move the floating :latest tag, "true" or "false".
        type: string
        default: 'true'
    outputs:
      digest:
        description: Digest of the published multi-arch manifest list.
        value: ${{ jobs.merge.outputs.digest }}
  # Rebuild weekly so the image picks up new base layers and apt security
  # updates even when containers/ has not changed.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      # GHCR rejects uppercase paths, and the owner is mixed case on the
      # upstream repository, so lowercase it here instead of hardcoding it.
      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/mjolnir/agent-dev" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # github.token works in a workflow_call context, where a called
          # workflow is not guaranteed to receive the GITHUB_TOKEN secret.
          password: ${{ github.token }}

      # Each runner is native for its own platform, so no QEMU emulation is
      # involved. Buildx passes TARGETARCH to the build automatically.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile.agent-dev
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: false
          # Reuse the previous build's layers from the registry so a commit that
          # changes one step, or only metadata, publishes an image that shares
          # every unchanged layer. Hosts then download only what changed. The
          # weekly run bypasses the cache on purpose: its job is to refresh the
          # base and apt layers.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.title=Mjolnir agent development environment
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Mjolnir agent development environment with Node, Rust, cargo-nextest, OpenJDK, and the pinned ACP bridges
            org.opencontainers.image.licenses=GPL-3.0-only
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/mjolnir/agent-dev" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The per-arch jobs pushed untagged manifests. This joins them into one
      # multi-arch tag that resolves to the right image on each host.
      - name: Create multi-arch manifest
        id: publish
        shell: bash
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          EXTRA_TAGS: ${{ inputs.extra_tags }}
          PUBLISH_LATEST: ${{ inputs.publish_latest || 'true' }}
        run: |
          set -euo pipefail
          tags=()
          if [ "$PUBLISH_LATEST" = "true" ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          tags+=(--tag "$IMAGE:sha-${GITHUB_SHA:0:7}")
          for tag in $EXTRA_TAGS; do
            tags+=(--tag "$IMAGE:$tag")
          done
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA:0:7}" \
            --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Inspect published image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA:0:7}"
