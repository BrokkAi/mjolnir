name: Platform test probe

# Run chosen tests on a macOS or Windows runner on demand. Check-ins run CI on
# Linux only, and the full platform lanes take about an hour, so this answers
# "does this test pass there, and what does it do" in minutes. A test that is
# still running after `hang_seconds` gets its process table printed (process
# group, terminal foreground group and state, where `ps` reports them) and is
# stopped, so a hang leaves evidence instead of a lane timeout.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        type: choice
        options:
        - macos-latest
        - windows-latest
        default: macos-latest
      package:
        description: Cargo package whose tests to run
        required: true
        default: brokk-mj-core
      filter:
        description: Test name filter, as passed to the test binary (empty runs every test)
        required: false
        default: ''
      skip:
        description: Test name filter to skip (empty skips nothing)
        required: false
        default: ''
      hang_seconds:
        description: Seconds before a still-running test is inspected and stopped
        required: true
        default: '120'

permissions:
  contents: read

jobs:
  probe:
    name: ${{ inputs.package }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.99.1

    - uses: ./.github/actions/cache-rust
      with:
        lane: platform-test-probe
        build-paths: target/debug

    - name: Build the tests
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: cargo test --locked -p "$PACKAGE" --no-run

    - name: Run the tests
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        FILTER: ${{ inputs.filter }}
        SKIP: ${{ inputs.skip }}
        HANG_SECONDS: ${{ inputs.hang_seconds }}
        RUST_BACKTRACE: '1'
      run: |
        arguments=("$FILTER" --nocapture)
        if [ -n "$SKIP" ]; then arguments+=(--skip "$SKIP"); fi
        cargo test --locked --no-fail-fast -p "$PACKAGE" -- "${arguments[@]}" &
        tests=$!
        for _ in $(seq "$HANG_SECONDS"); do
          if ! kill -0 "$tests" 2>/dev/null; then
            wait "$tests"
            exit $?
          fi
          sleep 1
        done
        echo "::error::the tests were still running after ${HANG_SECONDS}s"
        # Every process of this user, zombies included, then where each test
        # process is blocked (`sample` on macOS).
        ps -U "$(id -u)" -o pid,ppid,pgid,tpgid,stat,tty,command 2>/dev/null || ps -ef
        for pid in $(pgrep -f '/deps/' 2>/dev/null); do
          if command -v sample >/dev/null; then
            echo "::group::sample $pid"
            sample "$pid" 1 2>&1 | grep -E 'Thread_|^ *[+!:|]' | head -80
            echo "::endgroup::"
          fi
        done
        pkill -9 -f '/deps/' 2>/dev/null || true
        kill "$tests" 2>/dev/null || true
        exit 1
