[package]
name = "brokk-mj-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-agent orchestration and review layer for Mjolnir"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
publish = true

[dependencies]
mj-core.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
rmcp = { version = "1", features = ["server", "macros", "transport-async-rw"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tracing = "0.1"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
