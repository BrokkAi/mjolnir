# Mjolnir overlay for the shared pilot Codex profile.
[mcp_servers.rql]
command = "sh"
args = ["-c", 'exec python3 -B "${RQL_SSH_CONFIG%/*}/client.py"']
env_vars = [
    "RQL_SESSION_ASSIGNMENT_DIR", "RQL_SSH_CONFIG", "RQL_SSH_KNOWN_HOSTS", "RQL_SSH_KEY",
    "RQL_SSH_TARGET", "MJ_SESSION_ID",
]
startup_timeout_sec = 60
default_tools_approval_mode = "approve"
